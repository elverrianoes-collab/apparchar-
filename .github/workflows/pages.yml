# Publica la carpeta web/ en GitHub Pages cada vez que cambia en main.
# GitHub Pages solo permite elegir la raíz o /docs como carpeta de una rama;
# para publicar web/ hay que usar esta acción: Settings → Pages → Source: GitHub Actions.
name: Publicar prototipo en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
