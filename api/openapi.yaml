          description: Fecha de creación. La pone el servidor.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          description: Última modificación. La pone el servidor en cada cambio.
          readOnly: true
    TipoBoletaNuevo:
      type: object
      x-entidad: tipo_boleta
      additionalProperties: false
      description: |-
        Datos para crear un tipo de boleta. Los opcionales toman estos valores si no se envían:
        `descripcion` = `null`, `maximo_por_orden` = 10, `venta_inicia_en` = el momento de la creación y
        `venta_termina_en` = `fecha_inicio` del evento.
      required:
        - nombre
        - precio_cop
        - cantidad_total
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 60
          description: Nombre del tipo («General», «VIP»). No se repite dentro del mismo evento.
        descripcion:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Qué incluye el tipo de boleta.
          default: null
        precio_cop:
          type: integer
          minimum: 0
          maximum: 10000000
          description: Precio por boleta en pesos colombianos enteros. Debe ser 0 si el evento es gratuito.
        cantidad_total:
          type: integer
          minimum: 1
          maximum: 100000
          description: Cupo del tipo. Nunca menor que `cantidad_vendida`.
        maximo_por_orden:
          type: integer
          minimum: 1
          maximum: 20
          description: Tope de boletas de este tipo por compra; frena la reventa.
          default: 10
        venta_inicia_en:
          type: string
          format: date-time
          description: Desde cuándo se vende. Si no se envía, desde el momento de la creación.
        venta_termina_en:
          type: string
          format: date-time
          description: |-
            Hasta cuándo se vende; posterior a `venta_inicia_en` y no posterior a `fecha_fin` del evento. Si no
            se envía, hasta `fecha_inicio` del evento.
    TipoBoletaCambios:
      type: object
      x-entidad: tipo_boleta
      additionalProperties: false
      minProperties: 1
      description: |-
        Cambios parciales a un tipo de boleta; solo viajan los campos que cambian. El precio nuevo rige para
        las compras siguientes: las órdenes ya hechas conservan su `precio_unitario_cop`.
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 60
          description: Nombre del tipo («General», «VIP»). No se repite dentro del mismo evento.
        descripcion:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Qué incluye el tipo de boleta.
        precio_cop:
          type: integer
          minimum: 0
          maximum: 10000000
          description: Precio por boleta en pesos colombianos enteros. Debe ser 0 si el evento es gratuito.
        cantidad_total:
          type: integer
          minimum: 1
          maximum: 100000
          description: Cupo del tipo. Nunca menor que `cantidad_vendida`.
        maximo_por_orden:
          type: integer
          minimum: 1
          maximum: 20
          description: Tope de boletas de este tipo por compra; frena la reventa.
        venta_inicia_en:
          type: string
          format: date-time
          description: Desde cuándo se vende este tipo.
        venta_termina_en:
          type: string
          format: date-time
          description: Hasta cuándo se vende; posterior a `venta_inicia_en` y no posterior a `fecha_fin` del evento.
    Orden:
      type: object
      x-entidad: orden
      description: |-
        Una compra, con sus líneas (`items`) anidadas. Las condiciones `if`/`then`/`else` repiten las
        `CHECK` de la base que atan el estado a sus datos: `pagada_en` tiene valor solo si la orden está
        pagada o reembolsada; `referencia_pago`, solo si además `total_cop` es mayor que 0; `medio_pago` es
        `null` solo si `total_cop` es 0.
      required:
        - id
        - evento_id
        - comprador_nombre
        - comprador_correo
        - comprador_telefono
        - comprador_documento
        - medio_pago
        - autoriza_tratamiento_datos
        - total_cop
        - estado
        - expira_en
        - pagada_en
        - referencia_pago
        - creado_en
        - actualizado_en
        - items
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la orden; también es el enlace privado de la compra.
          readOnly: true
        evento_id:
          type: string
          format: uuid
          description: Evento comprado.
          readOnly: true
        comprador_nombre:
          type: string
          minLength: 3
          maxLength: 120
          description: Nombre y apellido del comprador; va impreso en las boletas.
        comprador_correo:
          type: string
          format: email
          minLength: 6
          maxLength: 254
          pattern: ^[^@\sA-Z]+@[^@\sA-Z]+\.[^@\sA-Z]+$
          description: Correo adonde llegan las boletas. El servidor lo guarda en minúsculas.
        comprador_telefono:
          type: string
          minLength: 13
          maxLength: 13
          pattern: ^\+573[0-9]{9}$
          description: Celular colombiano en E.164 (`+573XXXXXXXXX`) para avisos de cambios del evento.
        comprador_documento:
          type:
            - string
            - 'null'
          minLength: 6
          maxLength: 10
          pattern: ^[0-9]{6,10}$
          description: |-
            Cédula (6 a 10 dígitos, sin puntos). Obligatoria si el evento tiene `edad_minima`; se verifica en la
            puerta.
        medio_pago:
          anyOf:
            - $ref: '#/components/schemas/MedioPago'
            - type: 'null'
          description: Medio de pago elegido. `null` solo si la orden es gratuita (`total_cop` = 0).
        autoriza_tratamiento_datos:
          type: boolean
          const: true
          description: Autorización expresa de tratamiento de datos personales (Ley 1581 de 2012). Solo se acepta `true`.
        total_cop:
          type: integer
          minimum: 0
          description: Total a pagar en pesos. Lo calcula el servidor con los precios vigentes; el cliente no lo envía.
          readOnly: true
        estado:
          $ref: '#/components/schemas/EstadoOrden'
          readOnly: true
        expira_en:
          type: string
          format: date-time
          description: 'Hasta cuándo se reserva el cupo: `creado_en` + 15 minutos.'
          readOnly: true
        pagada_en:
          type:
            - string
            - 'null'
          format: date-time
          description: Momento de la confirmación del pago. `null` mientras la orden no esté pagada.
          readOnly: true
        referencia_pago:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
          description: |-
            Identificador de la transacción en la pasarela, para conciliar pagos. Lo guarda `confirmarPagoOrden`
            y es único: una misma transacción no confirma dos órdenes. `null` en las órdenes pendientes,
            expiradas o gratuitas.
          readOnly: true
        creado_en:
          type: string
          format: date-time
          description: Fecha de creación. La pone el servidor.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          description: Última modificación. La pone el servidor en cada cambio.
          readOnly: true
        items:
          type: array
          x-relacion: item_orden
          minItems: 1
          description: Líneas de la orden.
          items:
            $ref: '#/components/schemas/ItemOrden'
      allOf:
        - if:
            description: Si la orden está pagada o reembolsada…
            allOf:
              - required:
                  - estado
                properties:
                  estado:
                    enum:
                      - pagada
                      - reembolsada
          then:
            description: …`pagada_en` es la fecha del pago.
            allOf:
              - properties:
                  pagada_en:
                    type: string
          else:
            description: Si no, `pagada_en` es `null`.
            allOf:
              - properties:
                  pagada_en:
                    type: 'null'
        - if:
            description: Si la orden está pagada o reembolsada y `total_cop` es mayor que 0…
            allOf:
              - required:
                  - estado
                  - total_cop
                properties:
                  estado:
                    enum:
                      - pagada
                      - reembolsada
                  total_cop:
                    exclusiveMinimum: 0
          then:
            description: …`referencia_pago` es la referencia de la pasarela.
            allOf:
              - properties:
                  referencia_pago:
                    type: string
          else:
            description: Si no (pendiente, expirada o gratuita), `referencia_pago` es `null`.
            allOf:
              - properties:
                  referencia_pago:
                    type: 'null'
        - if:
            description: Si la orden es gratuita (`total_cop` = 0)…
            allOf:
              - required:
                  - total_cop
                properties:
                  total_cop:
                    const: 0
          then:
            description: …`medio_pago` es `null`.
            allOf:
              - properties:
                  medio_pago:
                    type: 'null'
          else:
            description: Si no, `medio_pago` es uno del dominio `medio_pago`.
            allOf:
              - properties:
                  medio_pago:
                    $ref: '#/components/schemas/MedioPago'
    OrdenNueva:
      type: object
      x-entidad: orden
      additionalProperties: false
      description: |-
        Datos para comprar sin crear cuenta. `total_cop`, `estado`, `expira_en` y `pagada_en` los calcula el
        servidor. `comprador_documento` es obligatorio si el evento tiene `edad_minima`; `medio_pago` es
        obligatorio si el total es mayor que 0 y se ignora si la orden es gratuita.
      required:
        - evento_id
        - items
        - comprador_nombre
        - comprador_correo
        - comprador_telefono
        - autoriza_tratamiento_datos
      properties:
        evento_id:
          type: string
          format: uuid
          description: Evento que se compra (lo toma la página del evento).
        items:
          type: array
          x-relacion: item_orden
          minItems: 1
          maxItems: 10
          description: Una línea por tipo de boleta; un tipo no se repite en la misma orden.
          items:
            $ref: '#/components/schemas/ItemOrdenNuevo'
        comprador_nombre:
          type: string
          minLength: 3
          maxLength: 120
          description: Nombre y apellido del comprador; va impreso en las boletas.
        comprador_correo:
          type: string
          format: email
          minLength: 6
          maxLength: 254
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          description: Correo adonde llegan las boletas. El servidor lo guarda en minúsculas.
        comprador_telefono:
          type: string
          minLength: 13
          maxLength: 13
          pattern: ^\+573[0-9]{9}$
          description: Celular colombiano en E.164 (`+573XXXXXXXXX`) para avisos de cambios del evento.
        comprador_documento:
          type: string
          minLength: 6
          maxLength: 10
          pattern: ^[0-9]{6,10}$
          description: |-
            Cédula (6 a 10 dígitos, sin puntos). Obligatoria si el evento tiene `edad_minima`; se verifica en la
            puerta.
        medio_pago:
          allOf:
            - $ref: '#/components/schemas/MedioPago'
          description: Obligatorio si el total es mayor que 0; en una orden gratuita se ignora y queda `null`.
        autoriza_tratamiento_datos:
          type: boolean
          const: true
          description: Autorización expresa de tratamiento de datos personales (Ley 1581 de 2012). Solo se acepta `true`.
    ItemOrden:
      type: object
      x-entidad: item_orden
      description: 'Línea de una orden: cuántas boletas de un tipo y a qué precio congelado.'
      required:
        - id
        - orden_id
        - tipo_boleta_id
        - cantidad
        - precio_unitario_cop
        - creado_en
        - actualizado_en
      properties:
