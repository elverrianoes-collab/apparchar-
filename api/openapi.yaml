# Contrato de la API de Apparchar · MVP del backend · OpenAPI 3.1.0
# Fuente de verdad de los nombres y tipos: docs/modelo-datos.md (se verifica con npm run verificar).
# Backend real: npm run api (Swagger UI en /docs)  ·  Servidor simulado: npm run mock  ·  Validación: npm run validar:api
openapi: 3.1.0
info:
  title: API de Apparchar
  version: 0.3.0
  summary: 'Boletería digital con QR para organizadores de eventos de Casanare: eventos, compras sin cuenta y validación en la puerta.'
  description: |
    Contrato de la API de **Apparchar**, la boletería digital con QR para organizadores pequeños de
    Casanare (Yopal, Aguazul, Tauramena, Villanueva, Monterrey, Paz de Ariporo…). Cubre el ciclo
    completo: el organizador crea y publica eventos con sus tipos de boleta, el público compra sin crear
    cuenta y recibe boletas con QR, y en la puerta se valida cada código desde un celular con la sesión
    del organizador.

    Se escribió **antes del código** (Entrega 2) y el backend de `servidor/` (Node.js, Express y
    PostgreSQL) lo implementa: valida cada petición contra estos mismos esquemas antes de tocar la base y
    responde con estos códigos de estado. El backend publica este archivo con Swagger UI en `/docs`. Los
    nombres de propiedades son los mismos atributos de `docs/modelo-datos.md`, y `npm run verificar`
    comprueba que no se desvíen.

    ## Convenciones

    - **Identificadores:** `uuid` (`format: uuid`), generados por la base. No son consecutivos: no se
      puede adivinar la orden de otra persona.
    - **Fechas:** ISO 8601 con desfase de Colombia, `2026-10-03T21:00:00-05:00` (`format: date-time`).
      Los filtros por día (`desde`, `hasta`) usan `format: date`.
    - **Dinero:** pesos colombianos enteros, sin centavos, en propiedades con sufijo `_cop`
      (`precio_cop`, `total_cop`).
    - **Nombres:** español y `snake_case`, iguales a los del modelo de datos, también en los parámetros
      de consulta y de ruta (`/eventos/{evento_id}`). Los `operationId` (`crearEvento`,
      `obtenerTipoBoleta`) van en camelCase porque son identificadores de código, no nombres de datos:
      los generadores de clientes los convierten en nombres de funciones y nunca viajan en una petición.
    - **Nulos:** las respuestas traen siempre todas las propiedades; las opcionales valen `null` cuando
      no tienen valor.

    ## Códigos de estado

    | Código | Cuándo |
    |---|---|
    | 200 | Lectura o actualización correcta. |
    | 201 | Recurso creado. La cabecera `Location` dice dónde consultarlo, salvo en `registrarValidacion`: una lectura de la puerta se consulta en `listarValidacionesDelEvento`. |
    | 204 | Borrado correcto, sin cuerpo. |
    | 400 | La petición **no cumple el esquema o se contradice a sí misma**, y se detecta sin consultar la base: JSON mal formado, tipo equivocado, obligatorio faltante, valor fuera de rango o del dominio, parámetro inválido, dos tipos de boleta con el mismo nombre en la misma petición o un tipo repetido en `items`. `codigo` = `solicitud_invalida` y `detalles` dice qué campo falló. |
    | 401 | Falta el token (o la clave de la pasarela) o no es válido (`no_autenticado`); en `iniciarSesion`, el correo o la clave no coinciden (`credenciales_invalidas`). |
    | 403 | El token es válido pero el recurso es de otro organizador (`sin_permiso`). |
    | 404 | El recurso no existe (`evento_no_encontrado`, `orden_no_encontrada`…). |
    | 409 | La petición **choca con el estado actual de un recurso en el servidor**: el problema no está en los datos enviados sino en algo que ya pasó o ya existe allá, así que no se corrige cambiando esos datos; hay que cambiar ese estado o esperar. Otra persona guardó antes (`conflicto_de_version`); ya no queda cupo (`cupo_insuficiente`); el evento no está publicado (`evento_no_disponible`), la venta del tipo cerró (`venta_cerrada`) o la puerta no está abierta (`evento_no_activo`); el estado del evento no admite el cambio (`transicion_no_permitida`, `evento_sin_tipos_de_boleta`, `evento_no_eliminable`); el tipo ya tiene ventas (`tipo_boleta_con_ventas`); la orden ya no está pendiente (`orden_no_pendiente`, `orden_expirada`); ese valor único ya lo tiene otro registro (`correo_ya_registrado`, `tipo_boleta_nombre_repetido`, `referencia_pago_repetida`); el organizador todavía tiene eventos y no se puede borrar (`organizador_con_eventos`). |
    | 422 | Los datos enviados están bien formados pero **rompen una regla del negocio**, y se corrige cambiando esos datos: fechas incoherentes (`fechas_incoherentes`), cupos que superan el aforo (`aforo_excedido`) o que bajan de lo vendido (`cupo_menor_que_vendidas`), precio en un evento gratuito (`precio_en_evento_gratuito`), ventana de venta inválida (`ventana_de_venta_invalida`), más boletas que el máximo por compra (`maximo_por_orden_excedido`), un tipo de otro evento (`tipo_de_otro_evento`), falta la cédula (`documento_requerido`) o el medio de pago (`medio_pago_requerido`). |

    ## Formato de error

    Todos los errores usan el esquema `Error`:

    ```json
    {
      "codigo": "aforo_excedido",
      "mensaje": "Los tipos de boleta suman 200 cupos y el aforo del Bar La Tranquera es de 180.",
      "detalles": [{ "campo": "tipos_boleta", "problema": "La suma de cantidad_total (200) supera aforo_total (180)." }]
    }
    ```

    `codigo` es estable (el frontend decide qué hacer con él), `mensaje` se muestra tal cual a la
    persona y `detalles` es opcional.

    ## Paginación

    Los listados reciben `pagina` (desde 1, por defecto 1) y `por_pagina` (1 a 50, por defecto 20) y
    devuelven un arreglo JSON. El total de registros que cumplen el filtro viaja en la cabecera
    `X-Total-Count`, para dibujar el paginador sin otra consulta.

    ## Autenticación

    Hay dos esquemas de seguridad:

    - **`bearerAuth`** (`Authorization: Bearer <token>`, JWT): las operaciones del organizador. El
      organizador se registra con `registrarOrganizador` (la clave se guarda como hash bcrypt, nunca en
      claro) y obtiene el token con `iniciarSesion`. El token es un JWT firmado por el backend (HS256)
      que trae `sub` = id del organizador y vence a las 8 horas; el backend deduce de él al dueño de
      cada evento, así que `organizador_id` nunca se envía. La validación en la puerta usa el mismo
      token: en esta versión valida solo el organizador dueño del evento, desde un celular con su
      sesión, y cada persona escribe su nombre en `validada_por`. Los porteros con cuenta propia quedan
      para una entrega posterior.

      Flujo: `POST /organizadores` (registro) → `POST /sesiones` (devuelve `token`) → enviar
      `Authorization: Bearer <token>` en cada operación protegida. En Swagger UI, el botón
      **Authorize** guarda el token para todas las pruebas.
    - **`pasarelaClave`** (cabecera `X-Clave-Pasarela`): solo `confirmarPagoOrden`, que llama la
      pasarela de pagos y nunca el navegador del comprador.

    Las operaciones públicas lo declaran de dos formas:

    - `security: []`: no usan token (registro y perfil de organizadores, cartelera, compra, consulta de
      órdenes y boletas).
    - `security: [{}, {bearerAuth: []}]`: el token es opcional (`obtenerEvento` y `obtenerTipoBoleta`).
      Sin token son públicas; con el del dueño muestran también sus borradores.

    ## Servidor simulado (Prism)

    `npm run mock` levanta Prism en `http://127.0.0.1:4010` y responde con los ejemplos de este archivo.
    Prism valida la petición contra el esquema y, en las operaciones protegidas, solo exige que llegue
    la cabecera: `Authorization` (cualquier token sirve) o, en `confirmarPagoOrden`, `X-Clave-Pasarela`
    (cualquier clave sirve). No filtra ni calcula nada: si no se le indica otra cosa, devuelve el primer
    ejemplo de la respuesta. Encabezados útiles:

    - `Prefer: code=404` fuerza un código de estado documentado.
    - `Prefer: example=yopal_conciertos` elige un ejemplo por su nombre. Los dos se combinan en uno
      solo: `Prefer: code=409, example=venta_cerrada`.

    Ojo con dos diferencias del simulador:

    - Si la petición **no cumple el esquema**, Prism responde **422** (o 400 cuando la operación no
      documenta 422) con el primer ejemplo de ese código, y describe la falla real en la cabecera
      `sl-violations`. El backend de la Entrega 3 responde en ese caso **400 `solicitud_invalida`**,
      como dice este contrato. Para ver el ejemplo 400 en el simulador, envía una petición válida con
      `Prefer: code=400`.
    - Si el cuerpo **no es JSON válido** (una coma de más, una comilla sin cerrar), Prism responde 400
      con su propio formato, `{"error": {"code": "invalid_json", "message": "Invalid JSON"}}`, y no con
      el esquema `Error`. El backend real responde **400 `solicitud_invalida`** con el esquema `Error`,
      como cualquier otra petición que no cumple el esquema.

    ```bash
    # Cartelera de Yopal: Prism no filtra, así que se pide por su nombre el ejemplo ya filtrado
    curl -s -H "Prefer: example=yopal_conciertos" "http://127.0.0.1:4010/eventos?municipio=Yopal&categoria=concierto"

    # Forzar el 404 del detalle de un evento
    curl -s -H "Prefer: code=404" http://127.0.0.1:4010/eventos/29f5422e-4b0e-4ff2-a6d7-eab5062461cb

    # Validar un código en la puerta y pedir el ejemplo de boleta ya usada
    curl -s -X POST http://127.0.0.1:4010/eventos/2e4c1c1d-d769-4047-9880-c8295fa22263/validaciones \
      -H "Authorization: Bearer demo" -H "Content-Type: application/json" \
      -H "Prefer: example=rechazada_ya_usada" \
      -d '{"codigo_leido":"956T-X8KV-CHV3","validada_por":"Nelson Ávila Barrera"}'

    # Confirmar el pago de la orden de Edwin, como lo haría la pasarela
    curl -s -X POST http://127.0.0.1:4010/ordenes/be8a62aa-a0e5-4bbd-be4b-74ab09a9d89a/pago \
      -H "X-Clave-Pasarela: demo" -H "Content-Type: application/json" \
      -d '{"referencia_pago":"PSE-20260929-185302"}'
    ```
  contact:
    name: Equipo Apparchar · Tecnologías Web 2026-B · Unitrópico
  license:
    name: Uso académico, sin licencia de distribución
    identifier: LicenseRef-Apparchar-Academico
servers:
  - url: http://localhost:3000
    description: 'Backend del MVP en local: `npm run api`'
  - url: http://127.0.0.1:4010
    description: 'Servidor simulado con Prism: `npm run mock`'
tags:
  - name: Sesiones
    description: |-
      Inicio de sesión del organizador: cambia correo y clave por un token JWT que se envía en
      `Authorization: Bearer <token>` en las operaciones protegidas.
  - name: Organizadores
    description: |-
      Quien crea eventos: un bar de Yopal, una fundación cultural de Tauramena, un consejo estudiantil.
      CRUD completo: se registra (pública), se consulta su perfil público, y con su propio token edita sus
      datos o borra su cuenta (solo si no tiene eventos).
  - name: Eventos
    description: |-
      Eventos con fecha, lugar y aforo, con su organizador y sus tipos de boleta anidados. La cartelera y
      el detalle son públicos (el detalle acepta un token opcional para que el dueño vea sus borradores);
      crear, editar (incluido publicar, pausar y cancelar) y borrar un borrador exigen el token del dueño.
      No hay PUT: toda edición es parcial (PATCH) y lleva `version` para el bloqueo optimista.
  - name: Tipos de boleta
    description: |-
      Localidades o clases de entrada de un evento (Preventa, General, VIP): precio, cupo y ventana de
      venta. Se crean anidados en el evento y se leen, editan o borran por su propio id; también llegan
      dentro de `Evento.tipos_boleta`.
  - name: Órdenes
    description: |-
      Compras sin cuenta: se crean `pendiente`, reservan cupo 15 minutos y pasan a `pagada` cuando la
      pasarela confirma el pago. No se editan ni se borran: son registro contable; los reembolsos los hace
      el sistema al cancelar el evento.
  - name: Boletas
    description: |-
      Entradas individuales con QR, una por unidad pagada. Las emite el servidor; por eso no hay POST,
      PATCH ni DELETE, solo lectura por orden o por código.
  - name: Validaciones
    description: |-
      Cada lectura de un código en la puerta, aceptada o rechazada. Es el registro de auditoría del
      ingreso y alimenta el conteo en vivo del aforo. Las registra el celular de la puerta con la sesión
      del organizador dueño del evento. Solo se agregan: una lectura no se edita ni se borra.
paths:
  /sesiones:
    post:
      operationId: iniciarSesion
      tags:
        - Sesiones
      summary: Iniciar sesión (obtener el token)
      description: |-
        Cambia el correo y la clave de un organizador por un token JWT firmado por el backend (HS256), que
        vence a las 8 horas. El token se envía después en `Authorization: Bearer <token>`. El correo se
        compara en minúsculas y la clave contra su hash bcrypt (`organizador.clave_hash`).

        Si el correo no existe o la clave no coincide responde lo mismo, 401 `credenciales_invalidas`,
        para no revelar qué correos están registrados. Por seguridad, cada dirección IP tiene un número
        limitado de intentos cada 15 minutos (429 `demasiados_intentos`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciales'
            examples:
              sabana_rock:
                summary: Inicio de sesión del Colectivo Sabana Rock
                value:
                  correo: colectivo.sabanarock@example.com
                  clave: SabanaRock2026
      responses:
        '200':
          description: 'Sesión iniciada; `token` va en `Authorization: Bearer <token>`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              examples:
                sabana_rock:
                  summary: Token del Colectivo Sabana Rock
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2YWFlMDkyMi00OGRiLTRlMDEtOTY2OC00YjJjZDk4NzkyYzUiLCJjb3JyZW8iOiJjb2xlY3Rpdm8uc2FiYW5hcm9ja0BleGFtcGxlLmNvbSJ9.firma
                    tipo: Bearer
                    expira_en: '2026-10-15T18:00:00-05:00'
                    organizador:
                      id: 6aae0922-48db-4e01-9668-4b2cd98792c5
                      nombre: Colectivo Sabana Rock
                      correo: colectivo.sabanarock@example.com
                      telefono: '+573105550148'
                      municipio: Yopal
                      creado_en: '2026-07-14T10:22:05-05:00'
                      actualizado_en: '2026-07-14T10:22:05-05:00'
        '400':
          description: |-
            La petición no cumple el esquema (JSON mal formado, tipo equivocado, obligatorio faltante, valor
            fuera de rango o del dominio, parámetro inválido) o se contradice a sí misma. Se detecta sin
            consultar la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                falta_clave:
                  summary: Falta la clave
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: clave
                        problema: Es obligatorio.
        '401':
          description: El correo no está registrado o la clave no coincide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                credenciales_invalidas:
                  summary: Correo o clave incorrectos
                  value:
                    codigo: credenciales_invalidas
                    mensaje: El correo o la clave no son correctos.
        '429':
          description: Demasiados intentos de inicio de sesión desde la misma dirección IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                demasiados_intentos:
                  summary: Se superó el límite de intentos
                  value:
                    codigo: demasiados_intentos
                    mensaje: Demasiados intentos de inicio de sesión. Espera unos minutos y vuelve a intentarlo.
  /organizadores:
    post:
      operationId: registrarOrganizador
      tags:
        - Organizadores
      summary: Registrar un organizador
      description: |-
        Crea la cuenta de un organizador (bar, colectivo, fundación, consejo estudiantil). Es pública porque
        es la puerta de entrada: todavía no hay token. El correo es único (índice `organizador_correo_key`)
        y se guarda en minúsculas; si ya existe, responde 409 `correo_ya_registrado`. La `clave` se guarda
        como hash bcrypt en `organizador.clave_hash` y nunca vuelve en una respuesta. Después del registro,
        el token se obtiene con `iniciarSesion` (`docs/decisiones.md`, D-23).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizadorNuevo'
            examples:
              sabana_rock:
                summary: Colectivo de rock llanero de Yopal
                value:
                  nombre: Colectivo Sabana Rock
                  correo: colectivo.sabanarock@example.com
                  telefono: '+573105550148'
                  municipio: Yopal
                  clave: SabanaRock2026
      responses:
        '201':
          description: Organizador registrado.
          headers:
            Location:
              description: Ruta del recurso creado.
              schema:
                type: string
                format: uri-reference
              example: /organizadores/6aae0922-48db-4e01-9668-4b2cd98792c5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizador'
              examples:
                sabana_rock:
                  summary: Organizador registrado con su id
                  value:
                    id: 6aae0922-48db-4e01-9668-4b2cd98792c5
                    nombre: Colectivo Sabana Rock
                    correo: colectivo.sabanarock@example.com
                    telefono: '+573105550148'
                    municipio: Yopal
                    creado_en: '2026-07-14T10:22:05-05:00'
                    actualizado_en: '2026-07-14T10:22:05-05:00'
        '400':
          description: |-
            La petición no cumple el esquema (JSON mal formado, tipo equivocado, obligatorio faltante, valor
            fuera de rango o del dominio, parámetro inválido) o se contradice a sí misma. Se detecta sin
            consultar la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                telefono_invalido:
                  summary: Teléfono sin el indicativo +57
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: telefono
                        problema: Usa el formato +573XXXXXXXXX (celular) o +5760XXXXXXXX (fijo).
                falta_nombre:
                  summary: Falta el nombre
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: nombre
                        problema: Es obligatorio (3 a 120 caracteres).
                municipio_invalido:
                  summary: Municipio escrito sin tilde («Mani»)
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: municipio
                        problema: 'Debe ser un municipio de Casanare escrito como en la lista: «Maní», con tilde.'
        '409':
          description: El correo ya pertenece a un organizador registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                correo_ya_registrado:
                  summary: El correo del Colectivo Sabana Rock ya está registrado
                  value:
                    codigo: correo_ya_registrado
                    mensaje: Ya existe un organizador con el correo colectivo.sabanarock@example.com. Inicia sesión o usa otro correo.
  /organizadores/{organizador_id}:
    get:
      operationId: obtenerOrganizador
      tags:
        - Organizadores
      summary: Ver el perfil público de un organizador
      description: |-
        Devuelve lo que cualquiera puede ver de un organizador en la cartelera: nombre y municipio. Omite
        correo y teléfono (`OrganizadorPublico`) para no exponer datos personales. Es pública.
      security: []
      parameters:
        - $ref: '#/components/parameters/organizador_id'
      responses:
        '200':
          description: Perfil público del organizador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizadorPublico'
              examples:
                sabana_rock:
                  summary: Colectivo Sabana Rock (Yopal)
                  value:
                    id: 6aae0922-48db-4e01-9668-4b2cd98792c5
                    nombre: Colectivo Sabana Rock
                    municipio: Yopal
        '400':
          description: |-
            La petición no cumple el esquema (JSON mal formado, tipo equivocado, obligatorio faltante, valor
            fuera de rango o del dominio, parámetro inválido) o se contradice a sí misma. Se detecta sin
            consultar la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                id_invalido:
                  summary: El identificador «sabana-rock» no es un UUID
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: organizador_id
                        problema: Debe ser un UUID, por ejemplo 29f5422e-4b0e-4ff2-a6d7-eab5062461cb.
        '404':
          description: No existe el recurso pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                organizador_no_encontrado:
                  summary: El id no corresponde a ningún organizador
                  value:
                    codigo: organizador_no_encontrado
                    mensaje: No encontramos ese organizador.
    patch:
      operationId: actualizarOrganizador
      tags:
        - Organizadores
      summary: Editar los datos de la cuenta
      description: |-
        Cambio parcial de los datos del organizador por él mismo: nombre, correo, teléfono, municipio o
        clave. Solo viajan los campos que cambian. Exige el token del mismo organizador (403 con el de
        otro). Si el correo nuevo ya es de otra cuenta responde 409 `correo_ya_registrado`. Una clave nueva
        se guarda otra vez como hash bcrypt; los tokens ya emitidos siguen sirviendo hasta que vencen.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/organizador_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizadorCambios'
            examples:
              telefono_y_municipio:
                summary: El colectivo cambia de celular y se muda a Aguazul
                value:
                  telefono: '+573125550911'
                  municipio: Aguazul
      responses:
        '200':
          description: Datos actualizados, con correo y teléfono (`Organizador`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizador'
              examples:
                telefono_y_municipio:
                  summary: Organizador con el teléfono y el municipio nuevos
                  value:
                    id: 6aae0922-48db-4e01-9668-4b2cd98792c5
                    nombre: Colectivo Sabana Rock
                    correo: colectivo.sabanarock@example.com
                    telefono: '+573125550911'
                    municipio: Aguazul
                    creado_en: '2026-07-14T10:22:05-05:00'
                    actualizado_en: '2026-10-12T09:15:40-05:00'
        '400':
