  /boletas/{codigo}:
    get:
      operationId: obtenerBoleta
      tags:
        - Boletas
      summary: Ver una boleta por su código
      description: |-
        Consulta una boleta por el código de su QR, para mostrarla en el celular del comprador o reenviarla.
        Es pública porque el código es la credencial: 12 caracteres aleatorios (unos 59 bits) imposibles de
        adivinar. La validación en la puerta no usa esta operación sino `registrarValidacion`, que deja
        rastro.
      security: []
      parameters:
