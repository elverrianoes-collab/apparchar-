                    mensaje: No encontramos esa orden. Revisa el enlace del correo de compra.
  /ordenes/{orden_id}/pago:
    post:
      operationId: confirmarPagoOrden
      tags:
        - Órdenes
      summary: Confirmar el pago de una orden (lo llama la pasarela)
      description: |-
        Confirma el pago de una orden `pendiente`. No la llama el comprador sino la pasarela de pagos, con
        la clave compartida en la cabecera `X-Clave-Pasarela` (esquema `pasarelaClave`): si la llamara el
        navegador, cualquiera podría marcar su orden como pagada sin pagar. En la Entrega 3 la usa un
        simulador de pasarela del lado del servidor; en producción la reemplaza la notificación firmada de
        Mercado Pago. El cuerpo trae la referencia de la transacción (`ConfirmacionPago`).

        Pasa la orden a `pagada`, pone `pagada_en` y `referencia_pago` y emite una boleta por unidad
        comprada (con `titular_nombre` = `comprador_nombre`).

        409, porque el estado actual lo impide: la orden ya no está pendiente (`orden_no_pendiente`: ya
        pagada o reembolsada), pasó `expira_en` (`orden_expirada`; si el proceso de expiración aún no la
        había marcado, la marca en ese momento y libera el cupo) o la referencia ya confirmó otra orden
        (`referencia_pago_repetida`, índice `orden_referencia_pago_key`).
      security:
        - pasarelaClave: []
      parameters:
        - $ref: '#/components/parameters/orden_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmacionPago'
            examples:
              pse_edwin:
                summary: La pasarela confirma el pago por PSE de Edwin
                value:
                  referencia_pago: PSE-20260929-185302
      responses:
        '200':
          description: Orden pagada, con su `referencia_pago`; sus boletas ya están emitidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orden'
              examples:
                pagada:
                  $ref: '#/components/examples/OrdenEdwinPagada'
        '400':
          description: |-
            La petición no cumple el esquema (JSON mal formado, tipo equivocado, obligatorio faltante, valor
            fuera de rango o del dominio, parámetro inválido) o se contradice a sí misma. Se detecta sin
            consultar la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                id_invalido:
                  summary: El identificador «orden-edwin» no es un UUID
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: orden_id
                        problema: Debe ser un UUID, por ejemplo 29f5422e-4b0e-4ff2-a6d7-eab5062461cb.
                falta_referencia:
                  summary: Falta la referencia de pago
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: referencia_pago
                        problema: 'Es obligatoria: de 1 a 64 caracteres entre letras sin tildes, números, guion y guion bajo.'
        '401':
          description: Falta la cabecera `X-Clave-Pasarela` o la clave no es la de la pasarela.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_autenticado:
                  summary: La petición no trae la clave de la pasarela
                  value:
                    codigo: no_autenticado
                    mensaje: 'Solo la pasarela de pagos puede confirmar un pago: falta la clave X-Clave-Pasarela o no es válida.'
        '404':
          description: No existe el recurso pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                orden_no_encontrada:
                  summary: El id no corresponde a ninguna orden
                  value:
                    codigo: orden_no_encontrada
                    mensaje: No encontramos esa orden.
        '409':
          description: |-
            El estado actual lo impide: la orden ya no está pendiente o la referencia de pago ya confirmó otra
            orden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                orden_no_pendiente:
                  summary: La orden de María Fernanda ya estaba pagada
                  value:
                    codigo: orden_no_pendiente
                    mensaje: La orden ya fue pagada el 2 de septiembre a las 7:44 p. m. con la referencia NEQUI-20260902-194406; un pago no se confirma dos veces.
                orden_expirada:
                  summary: La orden de Yuli Paola venció
                  value:
                    codigo: orden_expirada
                    mensaje: 'La reserva venció a los 15 minutos y el cupo se liberó: el pago no se aplica a esta orden.'
                referencia_pago_repetida:
                  summary: La referencia ya confirmó la orden de Juan David
                  value:
                    codigo: referencia_pago_repetida
                    mensaje: La referencia PSE-20260904-081555 ya confirmó otra orden; una transacción de la pasarela confirma una sola orden.
                    detalles:
                      - campo: referencia_pago
                        problema: Ya existe en otra orden.
