      required:
        - token
        - tipo
        - expira_en
        - organizador
      properties:
        token:
          type: string
          description: 'JWT firmado (HS256) con `sub` = id del organizador. Va en `Authorization: Bearer <token>`.'
        tipo:
          type: string
          const: Bearer
          description: Tipo de token; siempre `Bearer`.
        expira_en:
          type: string
          format: date-time
          description: Momento en que vence el token (8 horas después de emitido).
        organizador:
          $ref: '#/components/schemas/Organizador'
    Boleta:
      type: object
      x-entidad: boleta
      description: |-
        Entrada individual con código QR. Se emite una por unidad cuando la orden queda pagada. La condición
        `if`/`then`/`else` repite la `CHECK` de la base: `usada_en` tiene valor solo si la boleta está
        `usada`.
      required:
        - id
        - orden_id
        - tipo_boleta_id
        - codigo
        - titular_nombre
        - estado
        - usada_en
        - creado_en
        - actualizado_en
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la boleta.
          readOnly: true
        orden_id:
          type: string
          format: uuid
          description: Orden que emitió la boleta.
          readOnly: true
        tipo_boleta_id:
          type: string
          format: uuid
          description: Tipo de la boleta.
          readOnly: true
        codigo:
          type: string
          minLength: 14
          maxLength: 14
          pattern: ^[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}$
          description: |-
            Lo que codifica el QR y lo que se digita si la cámara falla: 12 caracteres sin letras ambiguas (sin
            I, L, O, 0 ni 1) en tres grupos. Funciona como credencial.
          readOnly: true
        titular_nombre:
          type: string
          minLength: 3
          maxLength: 120
          description: Nombre que ve el portero (copia de `comprador_nombre`).
          readOnly: true
        estado:
          $ref: '#/components/schemas/EstadoBoleta'
          readOnly: true
        usada_en:
          type:
            - string
            - 'null'
          format: date-time
          description: Momento del ingreso. `null` mientras la boleta no se haya usado.
          readOnly: true
        creado_en:
          type: string
          format: date-time
          description: Fecha de emisión. La pone el servidor.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          description: Última modificación. La pone el servidor en cada cambio.
          readOnly: true
      allOf:
        - if:
            description: Si la boleta está `usada`…
            allOf:
              - required:
                  - estado
                properties:
                  estado:
                    const: usada
          then:
            description: …`usada_en` es la fecha del ingreso.
            allOf:
              - properties:
                  usada_en:
                    type: string
          else:
            description: Si no, `usada_en` es `null`.
            allOf:
              - properties:
                  usada_en:
                    type: 'null'
    Validacion:
      type: object
      x-entidad: validacion
      description: |-
        Una lectura de código en la puerta, aceptada o rechazada. Es el registro de auditoría del ingreso.
        Las condiciones `if`/`then`/`else` repiten las `CHECK` de la base: una lectura aceptada no tiene
        `motivo` y una rechazada sí; con `motivo` = `no_existe`, `boleta_id` es `null`.
      required:
        - id
        - evento_id
        - boleta_id
        - codigo_leido
        - resultado
        - motivo
        - puerta
        - validada_por
        - validada_en
        - creado_en
        - actualizado_en
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la validación.
          readOnly: true
        evento_id:
          type: string
          format: uuid
          description: Evento en cuya puerta se leyó el código.
          readOnly: true
        boleta_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Boleta encontrada; `null` si el código no existe.
          readOnly: true
        codigo_leido:
          type: string
          minLength: 1
          maxLength: 64
          description: Lo que leyó la cámara o digitó el portero, tal como llegó.
        resultado:
          $ref: '#/components/schemas/ResultadoValidacion'
          readOnly: true
        motivo:
          anyOf:
            - $ref: '#/components/schemas/MotivoRechazo'
            - type: 'null'
          description: Por qué se rechazó. `null` si fue aceptada; obligatorio si fue rechazada.
          readOnly: true
        puerta:
          type: string
          minLength: 2
          maxLength: 40
          description: Acceso donde se validó.
        validada_por:
          type: string
          minLength: 2
          maxLength: 120
          description: |-
            Nombre de la persona que hizo la lectura. El celular de la puerta usa la sesión del organizador, así
            que este nombre es lo que dice quién validó.
        validada_en:
          type: string
          format: date-time
          description: |-
            Momento de la lectura según el reloj del servidor. Existe aparte de `creado_en` para cuando se
            sincronicen lecturas hechas sin conexión (fuera de alcance en esta versión).
          readOnly: true
        creado_en:
          type: string
          format: date-time
          description: Momento en que la lectura llegó al servidor. La pone el servidor.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          description: Última modificación. La pone el servidor en cada cambio.
          readOnly: true
      allOf:
        - if:
            description: Si la lectura fue `aceptada`…
            allOf:
              - required:
                  - resultado
                properties:
                  resultado:
                    const: aceptada
          then:
            description: …`motivo` es `null`.
            allOf:
              - properties:
                  motivo:
                    type: 'null'
          else:
            description: Si fue rechazada, `motivo` es uno del dominio `motivo_rechazo`.
            allOf:
              - properties:
                  motivo:
                    $ref: '#/components/schemas/MotivoRechazo'
        - if:
            description: Si el código no corresponde a ninguna boleta (`motivo` = `no_existe`)…
            allOf:
              - required:
                  - motivo
                properties:
                  motivo:
                    const: no_existe
          then:
            description: …`boleta_id` es `null`.
            allOf:
              - properties:
                  boleta_id:
                    type: 'null'
    ValidacionNueva:
      type: object
      x-entidad: validacion
      additionalProperties: false
      description: |-
        Lectura enviada por el celular de la puerta, con la sesión del organizador dueño del evento. El
        resultado y la hora de la lectura (`validada_en`) los pone el servidor.
      required:
        - codigo_leido
        - validada_por
      properties:
        codigo_leido:
          type: string
          minLength: 1
          maxLength: 64
          description: Lo que leyó la cámara o digitó el portero, tal como llegó.
        puerta:
          type: string
          minLength: 2
          maxLength: 40
          description: Acceso donde se validó. Si no se envía, `Principal`.
          default: Principal
        validada_por:
          type: string
          minLength: 2
          maxLength: 120
          description: |-
            Nombre de la persona que hizo la lectura. El celular de la puerta usa la sesión del organizador, así
            que este nombre es lo que dice quién validó.
