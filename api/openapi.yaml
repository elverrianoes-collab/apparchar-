                    mensaje: No encontramos ese tipo de boleta.
    patch:
      operationId: actualizarTipoBoleta
      tags:
        - Tipos de boleta
      summary: Editar un tipo de boleta
      description: |-
        Cambio parcial de un tipo de boleta por el dueño del evento: ampliar o reducir el cupo, cambiar el
        precio o mover la ventana de venta. La ruta es plana (`/tipos-boleta/{tipo_boleta_id}`) porque el id
        ya identifica el tipo y su evento. El precio nuevo solo rige para las compras siguientes. Si un
        evento `agotado` recibe cupo nuevo, el sistema lo devuelve a `publicado`.

        409, porque el estado actual lo impide: otro tipo del mismo evento ya se llama así
        (`tipo_boleta_nombre_repetido`), o el evento está `cancelado` o `finalizado` y sus tipos ya no se
        editan (`evento_no_disponible`).

        422, porque los datos enviados rompen una regla: el cupo no puede bajar de lo ya vendido
        (`cupo_menor_que_vendidas`); la suma de cupos del evento no puede superar el aforo
        (`aforo_excedido`); la ventana de venta debe seguir siendo válida (`ventana_de_venta_invalida`); en
        un evento gratuito el precio debe ser 0 (`precio_en_evento_gratuito`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tipo_boleta_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoBoletaCambios'
            examples:
              descripcion_y_cierre:
                summary: Detallar la localidad y cerrar la venta a las 7:30 p. m.
                value:
                  descripcion: Graderías norte y sur; entrada por la calle 24.
                  venta_termina_en: '2026-12-19T19:30:00-05:00'
              subir_precio:
                summary: Subir el precio de la General del Concierto de Navidad
                value:
                  precio_cop: 40000
      responses:
        '200':
          description: Tipo de boleta actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoBoleta'
              examples:
                descripcion_y_cierre:
                  summary: General del Concierto de Navidad con la descripción y el cierre nuevos
                  value:
                    id: a2a7625c-3c95-4371-8d67-37d40cbaf223
                    evento_id: 60089e49-5156-4359-8723-617455ee3826
                    nombre: General
                    descripcion: Graderías norte y sur; entrada por la calle 24.
                    precio_cop: 35000
                    cantidad_total: 2000
                    cantidad_vendida: 640
                    maximo_por_orden: 10
                    venta_inicia_en: '2026-09-15T10:00:00-05:00'
                    venta_termina_en: '2026-12-19T19:30:00-05:00'
                    creado_en: '2026-09-10T15:38:18-05:00'
                    actualizado_en: '2026-09-30T21:10:00-05:00'
        '400':
          description: |-
            La petición no cumple el esquema (JSON mal formado, tipo equivocado, obligatorio faltante, valor
            fuera de rango o del dominio, parámetro inválido) o se contradice a sí misma. Se detecta sin
            consultar la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cuerpo_vacio:
                  summary: Cuerpo sin campos
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: (cuerpo)
                        problema: Envía al menos un campo para cambiar.
                maximo_fuera_de_rango:
                  summary: Máximo por orden fuera de rango
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: maximo_por_orden
                        problema: Debe estar entre 1 y 20.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El token es válido, pero el recurso pertenece a otro organizador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sin_permiso:
                  summary: El recurso es de otro organizador
                  value:
                    codigo: sin_permiso
                    mensaje: Este tipo de boleta es de un evento de otro organizador.
        '404':
          description: No existe el recurso pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tipo_boleta_no_encontrado:
                  summary: El id no corresponde a ningún tipo de boleta
                  value:
                    codigo: tipo_boleta_no_encontrado
                    mensaje: No encontramos ese tipo de boleta.
        '409':
          description: |-
            El estado actual lo impide: otro tipo del evento ya se llama así, o el evento está cancelado o
            finalizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tipo_boleta_nombre_repetido:
                  summary: Renombrar la General de Navidad como «VIP»
                  value:
                    codigo: tipo_boleta_nombre_repetido
                    mensaje: El «Concierto de Navidad llanera» ya tiene un tipo de boleta llamado «VIP».
                    detalles:
                      - campo: nombre
                        problema: Ya existe en este evento.
                evento_no_disponible:
                  summary: El evento ya terminó
                  value:
                    codigo: evento_no_disponible
                    mensaje: 'El evento ya finalizó: sus tipos de boleta no se pueden editar.'
        '422':
          description: Los datos enviados rompen una regla del negocio; se corrige cambiando esos datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cupo_menor_que_vendidas:
                  summary: Bajar el VIP de Navidad a 40 cuando ya se vendieron 49
                  value:
                    codigo: cupo_menor_que_vendidas
                    mensaje: «VIP» ya tiene 49 boletas vendidas o reservadas; el cupo no puede bajar a 40.
                    detalles:
                      - campo: cantidad_total
                        problema: Debe ser al menos 49.
                aforo_excedido:
                  summary: Subir la General de Navidad a 2100 cupos
                  value:
                    codigo: aforo_excedido
                    mensaje: Con 2100 cupos en «General» el Concierto de Navidad sumaría 2600 y el aforo del coliseo es de 2500.
                    detalles:
                      - campo: cantidad_total
                        problema: Debe ser como máximo 2000.
                ventana_de_venta_invalida:
                  summary: Cerrar la venta después del evento
                  value:
                    codigo: ventana_de_venta_invalida
                    mensaje: La venta de «General» no puede terminar después del cierre del concierto (19 de diciembre, 11:30 p. m.).
                    detalles:
                      - campo: venta_termina_en
                        problema: No puede ser posterior a fecha_fin del evento.
                precio_en_evento_gratuito:
                  summary: Ponerle precio a la entrada libre de Monterrey
                  value:
                    codigo: precio_en_evento_gratuito
                    mensaje: '«Encuentro de arpa, cuatro y maracas de Monterrey» es gratuito: el precio debe ser $0.'
                    detalles:
                      - campo: precio_cop
                        problema: Debe ser 0 porque el evento es gratuito.
    delete:
      operationId: eliminarTipoBoleta
      tags:
        - Tipos de boleta
      summary: Borrar un tipo de boleta sin ventas
      description: |-
        Borra un tipo de boleta que nunca se ha vendido (ningún `item_orden` lo referencia, ni siquiera de
        órdenes expiradas). Si tiene ventas responde 409 `tipo_boleta_con_ventas`: las boletas emitidas y el
        historial de compras dependen de él. Para dejar de venderlo, basta con adelantar `venta_termina_en`.

        También responde 409 si es el único tipo de un evento que ya no está en borrador
        (`evento_sin_tipos_de_boleta`: un evento a la venta necesita al menos uno) o si el evento está
        `cancelado` o `finalizado` (`evento_no_disponible`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/tipo_boleta_id'
      responses:
        '204':
          description: Tipo de boleta borrado. Sin cuerpo.
        '400':
          description: |-
            La petición no cumple el esquema (JSON mal formado, tipo equivocado, obligatorio faltante, valor
            fuera de rango o del dominio, parámetro inválido) o se contradice a sí misma. Se detecta sin
            consultar la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                id_invalido:
                  summary: El identificador «vip» no es un UUID
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: tipo_boleta_id
                        problema: Debe ser un UUID, por ejemplo 29f5422e-4b0e-4ff2-a6d7-eab5062461cb.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El token es válido, pero el recurso pertenece a otro organizador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sin_permiso:
                  summary: El recurso es de otro organizador
                  value:
                    codigo: sin_permiso
                    mensaje: Este tipo de boleta es de un evento de otro organizador.
        '404':
          description: No existe el recurso pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tipo_boleta_no_encontrado:
                  summary: El id no corresponde a ningún tipo de boleta
                  value:
                    codigo: tipo_boleta_no_encontrado
                    mensaje: No encontramos ese tipo de boleta.
        '409':
          description: El tipo de boleta ya tiene ventas, es el único de un evento a la venta o el evento está cancelado o finalizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                evento_sin_tipos_de_boleta:
                  summary: Es el único tipo de un evento publicado
                  value:
                    codigo: evento_sin_tipos_de_boleta
                    mensaje: «Taller de avistamiento de aves» está publicado y necesita al menos un tipo de boleta. Agrega otro antes de borrar «Cupo único».
                evento_no_disponible:
                  summary: El evento ya está cancelado
                  value:
                    codigo: evento_no_disponible
                    mensaje: «Noche de rock llanero» está cancelado. Sus tipos de boleta ya no se borran.
                tipo_boleta_con_ventas:
                  summary: La Preventa de la noche de rock vendió sus 100 cupos
                  value:
                    codigo: tipo_boleta_con_ventas
                    mensaje: «Preventa» tiene 100 boletas vendidas y no se puede borrar. Si quieres dejar de venderlo, adelanta su fin de venta.
  /ordenes:
    post:
      operationId: crearOrden
      tags:
        - Órdenes
      summary: Comprar boletas (crear una orden)
      description: |-
        Crea una orden sin que el comprador tenga cuenta (por eso es pública). El servidor calcula
        `total_cop` con los precios vigentes, congela el precio en cada ítem y reserva el cupo en la misma
        transacción (`UPDATE … WHERE cantidad_vendida + n <= cantidad_total`): si no alcanza responde 409
        `cupo_insuficiente` y no reserva nada. La orden nace `pendiente` con `expira_en` = `creado_en` + 15
        minutos; si no se paga a tiempo pasa a `expirada` y libera el cupo.

        **Orden gratuita:** si `total_cop` = 0 (evento gratuito o tipos de $0) no hay nada que pagar: la
        orden nace directamente `pagada`, con `pagada_en` = `creado_en`, `medio_pago` = `null` y sus boletas
        ya emitidas (se consultan con `listarBoletasDeOrden`).

        Errores:

        - 400 `solicitud_invalida`, sin consultar la base: un tipo repetido en `items` (la petición se
          contradice a sí misma) o `autoriza_tratamiento_datos` distinto de `true`.
        - 404 si `evento_id` (`evento_no_encontrado`, también para borradores) o algún `tipo_boleta_id`
          (`tipo_boleta_no_encontrado`) no existen.
        - 409, porque el estado actual lo impide: no alcanza el cupo (`cupo_insuficiente`), el evento no
          está `publicado` (`evento_no_disponible`) o algún tipo está fuera de su ventana de venta
          (`venta_cerrada`).
        - 422, porque los datos enviados rompen una regla: una cantidad supera `maximo_por_orden`
          (`maximo_por_orden_excedido`), un tipo es de otro evento (`tipo_de_otro_evento`), el evento tiene
          `edad_minima` y falta `comprador_documento` (`documento_requerido`) o el total es mayor que 0 y
          falta `medio_pago` (`medio_pago_requerido`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenNueva'
            examples:
              taller_aves:
                summary: Edwin compra 1 cupo con transporte al taller de aves y paga por PSE
                value:
                  evento_id: 2e4c1c1d-d769-4047-9880-c8295fa22263
                  items:
                    - tipo_boleta_id: e2491ac2-a986-4783-80fc-1e383f847507
                      cantidad: 1
                  comprador_nombre: Edwin Alfonso Pidiache Salcedo
                  comprador_correo: edwinalfonso.pidiache@example.com
                  comprador_telefono: '+573185550922'
                  comprador_documento: '74862390'
                  medio_pago: pse
                  autoriza_tratamiento_datos: true
              gratuita:
                summary: Nidia pide 2 entradas libres para el encuentro de Monterrey
                value:
                  evento_id: 47741251-cb1b-458e-85e7-6af7835eb7a1
                  items:
                    - tipo_boleta_id: b96a6d8b-e0ee-4649-a6a5-303e4af2b3e9
                      cantidad: 2
                  comprador_nombre: Nidia Esperanza Tumay Ávila
                  comprador_correo: nidiaesperanza.tumay@example.com
                  comprador_telefono: '+573105550889'
                  autoriza_tratamiento_datos: true
      responses:
        '201':
          description: 'Orden creada: `pendiente` (hay que pagar antes de `expira_en`) o `pagada` si es gratuita.'
          headers:
            Location:
              description: Ruta del recurso creado.
              schema:
                type: string
                format: uri-reference
              example: /ordenes/be8a62aa-a0e5-4bbd-be4b-74ab09a9d89a
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orden'
              examples:
                pendiente:
                  $ref: '#/components/examples/OrdenEdwinPendiente'
                gratuita:
                  summary: 'Orden gratuita: nace pagada y con sus boletas emitidas'
                  value:
                    id: 7b1e9d42-6c3a-4f85-a0d7-5e2c8b4f1a63
                    evento_id: 47741251-cb1b-458e-85e7-6af7835eb7a1
                    comprador_nombre: Nidia Esperanza Tumay Ávila
                    comprador_correo: nidiaesperanza.tumay@example.com
                    comprador_telefono: '+573105550889'
                    comprador_documento: null
                    medio_pago: null
                    autoriza_tratamiento_datos: true
                    total_cop: 0
                    estado: pagada
                    expira_en: '2026-09-30T19:57:10-05:00'
                    pagada_en: '2026-09-30T19:42:10-05:00'
                    referencia_pago: null
                    items:
                      - id: c93f0a6e-4d21-4b7a-8e5f-2a6d9c1b7e48
                        orden_id: 7b1e9d42-6c3a-4f85-a0d7-5e2c8b4f1a63
                        tipo_boleta_id: b96a6d8b-e0ee-4649-a6a5-303e4af2b3e9
                        cantidad: 2
                        precio_unitario_cop: 0
                        creado_en: '2026-09-30T19:42:10-05:00'
                        actualizado_en: '2026-09-30T19:42:10-05:00'
                    creado_en: '2026-09-30T19:42:10-05:00'
                    actualizado_en: '2026-09-30T19:42:10-05:00'
        '400':
          description: |-
            La petición no cumple el esquema (JSON mal formado, tipo equivocado, obligatorio faltante, valor
            fuera de rango o del dominio, parámetro inválido) o se contradice a sí misma. Se detecta sin
            consultar la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sin_autorizacion:
                  summary: No autorizó el tratamiento de datos
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: autoriza_tratamiento_datos
                        problema: Debes autorizar el tratamiento de tus datos personales (Ley 1581 de 2012) para comprar.
                celular_invalido:
                  summary: Celular con formato equivocado
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: comprador_telefono
                        problema: 'Usa un celular colombiano con indicativo: +573XXXXXXXXX.'
                tipo_repetido:
                  summary: El mismo tipo de boleta en dos líneas
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: items[1].tipo_boleta_id
                        problema: Ese tipo de boleta ya está en items[0]; pide todas las boletas de un tipo en una sola línea.
        '404':
          description: No existe el evento o alguno de los tipos de boleta pedidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                evento_no_encontrado:
                  summary: El evento no existe
                  value:
                    codigo: evento_no_encontrado
                    mensaje: No encontramos ese evento.
                tipo_boleta_no_encontrado:
                  summary: Un tipo de boleta no existe
                  value:
                    codigo: tipo_boleta_no_encontrado
                    mensaje: No encontramos el tipo de boleta pedido.
                    detalles:
                      - campo: items[0].tipo_boleta_id
                        problema: No corresponde a ningún tipo de boleta.
        '409':
          description: |-
            El estado actual del evento o de sus tipos impide la compra: no alcanza el cupo, el evento no está
            publicado o la venta del tipo está cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cupo_insuficiente:
                  summary: Quedan menos cupos de los pedidos
                  value:
                    codigo: cupo_insuficiente
                    mensaje: Solo quedan 2 cupos de «Cupo con transporte desde Yopal» y pediste 3.
                    detalles:
                      - campo: items[0].cantidad
                        problema: 'Disponibles: 2.'
                evento_no_disponible:
                  summary: El stand-up está agotado
                  value:
                    codigo: evento_no_disponible
                    mensaje: '«Stand-up: Llanero pero no tanto» está agotado: ya no se venden boletas.'
                venta_cerrada:
                  summary: La preventa de la noche de rock ya cerró
                  value:
                    codigo: venta_cerrada
                    mensaje: La venta de «Preventa» terminó el 20 de septiembre a las 11:59 p. m.
                    detalles:
                      - campo: items[0].tipo_boleta_id
                        problema: Fuera de la ventana de venta.
        '422':
          description: Los datos enviados rompen una regla del negocio; se corrige cambiando esos datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                maximo_por_orden_excedido:
                  summary: Cuatro cupos cuando el máximo es tres
                  value:
                    codigo: maximo_por_orden_excedido
                    mensaje: «Cupo con transporte desde Yopal» permite máximo 3 por compra.
                    detalles:
                      - campo: items[0].cantidad
                        problema: Debe ser como máximo 3.
                tipo_de_otro_evento:
                  summary: La General de la noche de rock en una orden del taller
                  value:
                    codigo: tipo_de_otro_evento
                    mensaje: «General» no es un tipo de boleta de «Taller de fotografía de aves en los esteros».
                    detalles:
                      - campo: items[0].tipo_boleta_id
                        problema: Pertenece a otro evento.
                documento_requerido:
                  summary: Evento para mayores de 18 sin cédula
                  value:
                    codigo: documento_requerido
                    mensaje: 'La noche de rock es para mayores de 18 años: escribe tu número de cédula; se verifica en la puerta.'
                    detalles:
                      - campo: comprador_documento
                        problema: Es obligatorio porque el evento tiene edad mínima.
                medio_pago_requerido:
                  summary: Orden con total mayor que 0 sin medio de pago
                  value:
                    codigo: medio_pago_requerido
                    mensaje: 'Elige cómo vas a pagar: PSE, Nequi, Daviplata o tarjeta.'
                    detalles:
                      - campo: medio_pago
                        problema: Es obligatorio porque el total es $185.000.
