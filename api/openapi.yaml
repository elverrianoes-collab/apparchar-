    patch:
      operationId: actualizarEvento
      tags:
        - Eventos
      summary: Editar, publicar, pausar o cancelar un evento
      description: |-
        Cambio parcial del evento por su dueño. Envía la `version` que leyó (bloqueo optimista: si otra
        persona guardó antes responde 409 `conflicto_de_version` en vez de pisar el cambio) y solo los
        campos que cambian. Cada cambio exitoso sube `version` en 1.

        El estado se cambia con este mismo PATCH (en lugar de rutas `/publicar` o `/cancelar`) para mantener
        pocas rutas. Transiciones que puede pedir el organizador: `borrador` → `publicado`; `publicado` ⇄
        `pausado`; `publicado`, `pausado` o `agotado` → `cancelado` (el sistema reembolsa las órdenes
        pagadas y cancela sus boletas).

        409, porque el estado actual del evento lo impide: `conflicto_de_version`; `transicion_no_permitida`
        si se pide cualquier otra transición o cualquier cambio a un evento `cancelado` o `finalizado`;
        `evento_sin_tipos_de_boleta` si se publica un borrador que todavía no tiene tipos de boleta (hay que
        agregarlos antes con `crearTipoBoleta`).

        422, porque los datos enviados rompen una regla: publicar con `fecha_inicio` pasada o mover
        `fecha_fin` antes del cierre de venta de algún tipo (`fechas_incoherentes`); bajar el aforo por
        debajo de la suma de cupos (`aforo_excedido`); marcar `es_gratuito` con tipos que tienen precio
        (`precio_en_evento_gratuito`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/evento_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
