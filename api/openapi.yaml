      summary: Borrar la cuenta
      description: |-
        Borra la cuenta del organizador por él mismo. Solo se puede si no tiene eventos (la clave foránea
        `evento.organizador_id` es `RESTRICT`): los eventos con ventas son registro contable. Si tiene
        eventos responde 409 `organizador_con_eventos`; primero se borran sus borradores con
        `eliminarEvento`.
