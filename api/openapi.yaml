  /eventos:
    get:
      operationId: listarEventos
      tags:
        - Eventos
      summary: Consultar la cartelera
      description: |-
        La cartelera pública: solo eventos `publicado` y `agotado` (los agotados se muestran para que la
        gente sepa que existen). Borradores, pausados, cancelados y finalizados no aparecen aquí. Admite
        búsqueda libre, filtros por municipio, categoría y fechas, y el filtro `slug` para abrir un evento
        desde su URL legible. Usa los índices `evento_cartelera_idx`, `evento_municipio_idx`,
        `evento_categoria_idx` y, para `q`, `evento_busqueda_idx`.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: Texto a buscar en `nombre` y `lugar` (sin distinguir mayúsculas ni tildes).
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: joropo
        - name: municipio
          in: query
          required: false
          description: Municipio del evento (dominio `municipio_casanare`, escrito tal cual, con tildes).
          schema:
            $ref: '#/components/schemas/MunicipioCasanare'
          example: Yopal
        - name: categoria
          in: query
          required: false
          description: Categoría del evento.
          schema:
            $ref: '#/components/schemas/CategoriaEvento'
          example: concierto
        - name: desde
          in: query
          required: false
          description: Eventos cuya `fecha_inicio` (hora de Colombia) es este día o posterior.
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: hasta
          in: query
          required: false
          description: |-
            Eventos cuya `fecha_inicio` (hora de Colombia) es este día o anterior. Si es anterior a `desde`,
            responde 400.
          schema:
            type: string
            format: date
          example: '2026-12-31'
        - name: estado
          in: query
          required: false
          description: Solo uno de los dos estados visibles en la cartelera.
          schema:
            type: string
            enum:
              - publicado
              - agotado
          example: publicado
        - name: slug
          in: query
          required: false
          description: Slug exacto; devuelve cero o un evento.
          schema:
            type: string
            minLength: 3
            maxLength: 140
            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          example: noche-de-rock-llanero-sabana-electrica-en-vivo-2026-7d40
        - name: orden
          in: query
          required: false
          description: |-
            Orden por fecha de inicio: `fecha_inicio` (los más próximos primero) o `-fecha_inicio` (los más
            lejanos primero).
          schema:
            type: string
            enum:
              - fecha_inicio
              - '-fecha_inicio'
            default: fecha_inicio
          example: fecha_inicio
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/por_pagina'
      responses:
        '200':
          description: Página de la cartelera.
          headers:
            X-Total-Count:
              description: Total de registros que cumplen el filtro, sin contar la paginación.
              schema:
                type: integer
                minimum: 0
              example: 12
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'
              examples:
                cartelera:
                  $ref: '#/components/examples/CarteleraCompleta'
                yopal_conciertos:
                  $ref: '#/components/examples/CarteleraYopalConciertos'
        '400':
          description: |-
            La petición no cumple el esquema (JSON mal formado, tipo equivocado, obligatorio faltante, valor
            fuera de rango o del dominio, parámetro inválido) o se contradice a sí misma. Se detecta sin
            consultar la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                categoria_invalida:
                  summary: Categoría fuera del dominio
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: categoria
                        problema: 'Debe ser una de: concierto, fiesta, conferencia, deportes, teatro, festival, otro.'
                municipio_invalido:
                  summary: '`municipio=Villavicencio`: no es un municipio de Casanare'
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: municipio
                        problema: 'Debe ser uno de los 19 municipios de Casanare: Aguazul, Chámeza, Hato Corozal, La Salina, Maní, Monterrey, Nunchía, Orocué, Paz de Ariporo, Pore, Recetor, Sabanalarga, Sácama, San Luis de Palenque, Támara, Tauramena, Trinidad, Villanueva o Yopal.'
                fechas_invertidas:
                  summary: '`hasta` anterior a `desde`'
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: hasta
                        problema: Debe ser igual o posterior a desde (2026-12-01).
                por_pagina:
                  summary: '`por_pagina` fuera de rango'
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: por_pagina
                        problema: Debe estar entre 1 y 50.
    post:
      operationId: crearEvento
      tags:
        - Eventos
      summary: Crear un evento
      description: |-
        Crea un evento en `borrador` a nombre del organizador del token, opcionalmente con sus tipos de
        boleta. El servidor genera `slug` y pone `version` = 1. Nace en borrador para que el organizador lo
        revise antes de publicarlo con `actualizarEvento`.

        Reglas de negocio (422): `fecha_fin` posterior a `fecha_inicio` y `fecha_inicio` futura
        (`fechas_incoherentes`); la suma de `cantidad_total` de los tipos no supera `aforo_total`
