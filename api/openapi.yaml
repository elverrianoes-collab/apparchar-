          format: date-time
          description: Hora de inicio (ISO 8601 con desfase `-05:00`). Debe ser futura al publicar.
        fecha_fin:
          type: string
          format: date-time
          description: Hora de cierre; posterior a `fecha_inicio` (puede ser la madrugada siguiente).
        aforo_total:
          type: integer
          minimum: 1
          maximum: 100000
          description: |-
            Capacidad autorizada del lugar. La suma de `cantidad_total` de los tipos de boleta no puede
            superarla.
        edad_minima:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 21
          description: |-
            Edad mínima para entrar; `null` = todo público. Si tiene valor, la compra exige
            `comprador_documento`.
        es_gratuito:
          type: boolean
          description: 'Evento de entrada libre con boleta para controlar el aforo: todos sus tipos valen 0.'
        politica_reembolso:
          $ref: '#/components/schemas/PoliticaReembolso'
        imagen_url:
          type:
            - string
            - 'null'
