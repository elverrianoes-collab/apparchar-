components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Token JWT en `Authorization: Bearer <token>` que identifica a un organizador. Lo emite el propio
        backend con `iniciarSesion` (`POST /sesiones`), firmado con HS256 y la clave secreta `JWT_SECRETO`
        del servidor, con `sub` = id del organizador y vencimiento a las 8 horas. Si falta, está vencido,
        tiene otra firma o el organizador ya no existe, el backend responde 401 `no_autenticado`. En esta
        versión no hay cuentas de portero: en la puerta, el celular usa la sesión del organizador dueño del
        evento. El servidor simulado solo exige que el encabezado exista.
    pasarelaClave:
      type: apiKey
      in: header
      name: X-Clave-Pasarela
      description: |-
        Clave compartida con la pasarela de pagos; solo la usa `confirmarPagoOrden`. En la Entrega 3 la
        envía un simulador de pasarela que corre del lado del servidor, nunca el navegador del comprador:
        una clave que llega al navegador deja de ser secreta. En producción la reemplaza la notificación
        firmada de Mercado Pago. El servidor simulado solo exige que la cabecera exista.
  parameters:
    organizador_id:
      name: organizador_id
      in: path
      required: true
      description: Id del organizador.
      schema:
        type: string
        format: uuid
      examples:
        sabana_rock:
          summary: Colectivo Sabana Rock
          value: 6aae0922-48db-4e01-9668-4b2cd98792c5
    evento_id:
      name: evento_id
      in: path
      required: true
      description: Id del evento.
      schema:
        type: string
        format: uuid
      examples:
        noche_rock:
          summary: Noche de rock llanero (Yopal)
          value: 29f5422e-4b0e-4ff2-a6d7-eab5062461cb
        taller_aves:
          summary: Taller de fotografía de aves (Paz de Ariporo)
          value: 2e4c1c1d-d769-4047-9880-c8295fa22263
    tipo_boleta_id:
      name: tipo_boleta_id
      in: path
      required: true
      description: Id del tipo de boleta.
      schema:
        type: string
        format: uuid
      examples:
        general_navidad:
          summary: General del Concierto de Navidad llanera
          value: a2a7625c-3c95-4371-8d67-37d40cbaf223
        preventa_rock:
          summary: Preventa de la noche de rock
          value: bbb0963f-a597-4129-9f01-34a6937cd85e
    orden_id:
      name: orden_id
      in: path
      required: true
      description: Id de la orden (enlace privado de la compra).
      schema:
        type: string
        format: uuid
      examples:
        maria_fernanda:
          summary: Orden pagada de María Fernanda
          value: 360e1d4a-f8fe-4cea-a355-3278e0a0a003
        edwin:
          summary: Orden de Edwin
          value: be8a62aa-a0e5-4bbd-be4b-74ab09a9d89a
    codigo:
      name: codigo
      in: path
      required: true
      description: Código de la boleta (lo que codifica el QR).
      schema:
        type: string
        minLength: 14
        maxLength: 14
        pattern: ^[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}$
      examples:
        maria_fernanda:
          summary: Primera boleta de María Fernanda
          value: 956T-X8KV-CHV3
    pagina:
      name: pagina
      in: query
      required: false
      description: Número de página, desde 1 (máximo 10.000).
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
      example: 1
    por_pagina:
      name: por_pagina
      in: query
      required: false
      description: Registros por página (1 a 50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      example: 20
  responses:
    NoAutenticado:
      description: Falta el token o no es válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
