                        problema: 'Debe ser uno de: pendiente, pagada, expirada, reembolsada.'
                por_pagina:
                  summary: '`por_pagina` fuera de rango'
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: por_pagina
                        problema: Debe estar entre 1 y 50.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El token es válido, pero el recurso pertenece a otro organizador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sin_permiso:
                  summary: El recurso es de otro organizador
                  value:
                    codigo: sin_permiso
                    mensaje: Solo el organizador del evento puede ver sus ventas.
        '404':
          description: No existe el recurso pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                evento_no_encontrado:
                  summary: El id no corresponde a ningún evento
                  value:
                    codigo: evento_no_encontrado
                    mensaje: No encontramos ese evento.
  /ordenes/{orden_id}/boletas:
