                    cantidad_total: 10
                    cantidad_vendida: 0
                    maximo_por_orden: 10
                    venta_inicia_en: '2026-09-30T20:25:00-05:00'
                    venta_termina_en: '2027-01-16T20:00:00-05:00'
                    creado_en: '2026-09-30T20:25:00-05:00'
                    actualizado_en: '2026-09-30T20:25:00-05:00'
        '400':
          description: |-
            La petición no cumple el esquema (JSON mal formado, tipo equivocado, obligatorio faltante, valor
            fuera de rango o del dominio, parámetro inválido) o se contradice a sí misma. Se detecta sin
            consultar la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
