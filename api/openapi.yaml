        Boletas emitidas por una orden, para mostrarlas con su QR. Pública por la misma razón que
        `obtenerOrden`. Devuelve una lista vacía mientras la orden no esté pagada (o si expiró). No se
        pagina: una orden tiene como máximo 10 ítems de hasta 20 boletas.
