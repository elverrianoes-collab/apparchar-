          type: string
          format: uuid
          description: Identificador de la línea de la orden.
          readOnly: true
        orden_id:
          type: string
          format: uuid
          description: Orden a la que pertenece la línea.
          readOnly: true
        tipo_boleta_id:
          type: string
          format: uuid
          description: Tipo de boleta comprado; debe ser del mismo evento de la orden.
        cantidad:
          type: integer
          minimum: 1
          maximum: 20
          description: Boletas de este tipo; no supera `maximo_por_orden` del tipo.
        precio_unitario_cop:
          type: integer
          minimum: 0
          description: Precio del tipo congelado en el momento de la compra.
          readOnly: true
        creado_en:
          type: string
          format: date-time
          description: Fecha de creación. La pone el servidor.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          description: Última modificación. La pone el servidor en cada cambio.
          readOnly: true
    ItemOrdenNuevo:
      type: object
      x-entidad: item_orden
      additionalProperties: false
      description: Línea pedida por el comprador. El precio lo pone el servidor.
      required:
        - tipo_boleta_id
        - cantidad
      properties:
        tipo_boleta_id:
          type: string
          format: uuid
          description: Tipo de boleta comprado; debe ser del mismo evento de la orden.
        cantidad:
          type: integer
          minimum: 1
          maximum: 20
          description: Boletas de este tipo; no supera `maximo_por_orden` del tipo.
    ConfirmacionPago:
      type: object
      additionalProperties: false
      description: |-
        Lo que informa la pasarela al confirmar un pago. `referencia_pago` se guarda en
        `orden.referencia_pago`, donde es única: una misma transacción no confirma dos órdenes.
      required:
        - referencia_pago
      properties:
        referencia_pago:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Identificador de la transacción en la pasarela: letras sin tildes, números, guion y guion bajo.'
    Credenciales:
      type: object
      additionalProperties: false
      description: Correo y clave para iniciar sesión. Esquema de transporte; no se guarda.
      required:
        - correo
        - clave
      properties:
        correo:
          type: string
          format: email
          minLength: 6
          maxLength: 254
          description: Correo con el que se registró el organizador (se compara en minúsculas).
        clave:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: Clave del organizador.
    Sesion:
      type: object
