  schemas:
    Error:
      type: object
      description: |-
        Forma única de todos los errores de la API. `codigo` es estable y sirve para programar; `mensaje` es
        para mostrar a la persona; `detalles` lista los campos con problema (sobre todo en 400).
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          pattern: ^[a-z0-9_]+$
          description: Identificador estable del error, en snake_case.
        mensaje:
          type: string
          description: Explicación en español para mostrar a la persona.
        detalles:
          type: array
          description: Problemas por campo; aparece sobre todo en las respuestas 400.
          items:
            type: object
            required:
              - campo
              - problema
            properties:
              campo:
                type: string
                description: Nombre del campo o parámetro, con la ruta si está anidado (`tipos_boleta[0].precio_cop`).
              problema:
                type: string
                description: Qué está mal, en español.
    CategoriaEvento:
      type: string
      description: 'Dominio `categoria_evento`: filtra la cartelera.'
      enum:
        - concierto
        - fiesta
        - conferencia
        - deportes
        - teatro
        - festival
        - otro
    MunicipioCasanare:
      type: string
      description: |-
        Dominio `municipio_casanare`: los 19 municipios de Casanare, escritos tal cual (con tildes y
        espacios). Lista cerrada para que la cartelera no parta un mismo municipio en variantes («Mani»,
        «maní», «Maní »).
      enum:
        - Aguazul
        - Chámeza
        - Hato Corozal
        - La Salina
        - Maní
        - Monterrey
        - Nunchía
        - Orocué
        - Paz de Ariporo
        - Pore
        - Recetor
        - Sabanalarga
        - Sácama
        - San Luis de Palenque
        - Támara
        - Tauramena
        - Trinidad
        - Villanueva
        - Yopal
    EstadoEvento:
      type: string
      description: |-
        Dominio `estado_evento`. Transiciones: `borrador` → `publicado` (organizador) · `publicado` ⇄
        `pausado` (organizador) · `publicado` → `agotado` y de vuelta (sistema, según el cupo) ·
        `publicado`, `pausado` o `agotado` → `cancelado` (organizador) o `finalizado` (sistema, al pasar
        `fecha_fin`).
      enum:
        - borrador
        - publicado
        - pausado
        - agotado
        - cancelado
        - finalizado
    PoliticaReembolso:
      type: string
      description: 'Dominio `politica_reembolso`: hasta cuándo se devuelve el dinero.'
      enum:
        - ninguno
        - hasta_24h_antes
        - hasta_72h_antes
    MedioPago:
      type: string
      description: 'Dominio `medio_pago`: PSE, Nequi, Daviplata o tarjeta.'
      enum:
        - pse
        - nequi
        - daviplata
        - tarjeta
    EstadoOrden:
      type: string
      description: |-
        Dominio `estado_orden`. `pendiente` → `pagada` (pago confirmado o total 0) · `pendiente` →
        `expirada` (sistema, al pasar `expira_en`) · `pagada` → `reembolsada` (cancelación del evento).
      enum:
        - pendiente
        - pagada
        - expirada
        - reembolsada
    EstadoBoleta:
      type: string
      description: Dominio `estado_boleta`. `valida` → `usada` (ingreso aceptado) · `valida` → `cancelada` (reembolso).
      enum:
        - valida
        - usada
        - cancelada
    ResultadoValidacion:
      type: string
      description: 'Dominio `resultado_validacion`: si la persona entra o no.'
      enum:
        - aceptada
        - rechazada
    MotivoRechazo:
      type: string
      description: |-
        Dominio `motivo_rechazo`: `ya_usada` (la boleta ya entró), `cancelada` (boleta reembolsada),
        `otro_evento` (la boleta es de otro evento), `no_existe` (el código no corresponde a ninguna
        boleta).
      enum:
        - ya_usada
        - cancelada
        - otro_evento
        - no_existe
    Organizador:
      type: object
      x-entidad: organizador
      description: Organizador completo, con datos de contacto. Solo se devuelve al registrarlo.
      required:
        - id
        - nombre
        - correo
        - telefono
        - municipio
        - creado_en
        - actualizado_en
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del organizador.
          readOnly: true
        nombre:
          type: string
          minLength: 3
          maxLength: 120
          description: 'Nombre público del organizador: persona, colectivo o empresa.'
        correo:
          type: string
          format: email
          minLength: 6
          maxLength: 254
          pattern: ^[^@\sA-Z]+@[^@\sA-Z]+\.[^@\sA-Z]+$
          description: Correo de contacto y de acceso. Único en Apparchar; el servidor lo guarda en minúsculas.
        telefono:
          type: string
          minLength: 13
          maxLength: 13
          pattern: ^\+57(3[0-9]{9}|60[1-8][0-9]{7})$
          description: 'Teléfono en formato E.164 de Colombia: celular `+573XXXXXXXXX` o fijo `+5760XXXXXXXX`.'
        municipio:
          $ref: '#/components/schemas/MunicipioCasanare'
          description: Municipio base del organizador (dominio `municipio_casanare`).
        creado_en:
          type: string
          format: date-time
          description: Fecha de registro. La pone el servidor.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          description: Última modificación. La pone el servidor en cada cambio.
          readOnly: true
    OrganizadorPublico:
      type: object
      x-entidad: organizador
      description: 'Lo que cualquiera ve de un organizador en la cartelera: sin correo ni teléfono.'
      required:
        - id
        - nombre
        - municipio
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del organizador.
          readOnly: true
        nombre:
          type: string
          minLength: 3
          maxLength: 120
          description: 'Nombre público del organizador: persona, colectivo o empresa.'
        municipio:
          $ref: '#/components/schemas/MunicipioCasanare'
          description: Municipio base del organizador (dominio `municipio_casanare`).
    OrganizadorNuevo:
      type: object
      x-entidad: organizador
      additionalProperties: false
      description: |-
        Datos para registrar un organizador. `id`, `creado_en` y `actualizado_en` los pone el servidor; la
        `clave` se convierte en `clave_hash`.
      required:
        - nombre
        - correo
        - telefono
        - municipio
        - clave
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 120
          description: 'Nombre público del organizador: persona, colectivo o empresa.'
        correo:
          type: string
          format: email
          minLength: 6
          maxLength: 254
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          description: Correo de contacto y de acceso. Único en Apparchar; el servidor lo guarda en minúsculas.
        telefono:
          type: string
          minLength: 13
          maxLength: 13
          pattern: ^\+57(3[0-9]{9}|60[1-8][0-9]{7})$
          description: 'Teléfono en formato E.164 de Colombia: celular `+573XXXXXXXXX` o fijo `+5760XXXXXXXX`.'
        municipio:
          $ref: '#/components/schemas/MunicipioCasanare'
          description: Municipio base del organizador (dominio `municipio_casanare`).
        clave:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          x-guarda-como: clave_hash
          description: |-
            Clave de acceso, de 8 a 72 caracteres (y como máximo 72 bytes: la ñ y las letras con tilde ocupan 2).
            Nunca se guarda en claro: el servidor guarda su hash bcrypt en `organizador.clave_hash` y la clave no
            vuelve en ninguna respuesta.
    OrganizadorCambios:
      type: object
      x-entidad: organizador
      additionalProperties: false
      minProperties: 1
      description: Cambios parciales a la cuenta del organizador; solo viajan los campos que cambian.
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 120
          description: 'Nombre público del organizador: persona, colectivo o empresa.'
        correo:
          type: string
          format: email
          minLength: 6
          maxLength: 254
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          description: Correo de contacto y de acceso. Único en Apparchar; el servidor lo guarda en minúsculas.
        telefono:
          type: string
          minLength: 13
          maxLength: 13
          pattern: ^\+57(3[0-9]{9}|60[1-8][0-9]{7})$
          description: 'Teléfono en formato E.164 de Colombia: celular `+573XXXXXXXXX` o fijo `+5760XXXXXXXX`.'
        municipio:
          $ref: '#/components/schemas/MunicipioCasanare'
          description: Municipio base del organizador (dominio `municipio_casanare`).
        clave:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          x-guarda-como: clave_hash
          description: |-
            Clave de acceso, de 8 a 72 caracteres (y como máximo 72 bytes: la ñ y las letras con tilde ocupan 2).
            Nunca se guarda en claro: el servidor guarda su hash bcrypt en `organizador.clave_hash` y la clave no
            vuelve en ninguna respuesta.
    Evento:
      type: object
      x-entidad: evento
      description: Evento con su organizador (parte pública) y sus tipos de boleta anidados.
      required:
        - id
        - organizador_id
        - nombre
        - slug
        - descripcion
        - categoria
        - lugar
        - direccion
        - municipio
        - fecha_inicio
        - fecha_fin
        - aforo_total
        - edad_minima
        - es_gratuito
        - politica_reembolso
        - imagen_url
        - estado
        - version
        - creado_en
        - actualizado_en
        - organizador
        - tipos_boleta
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del evento.
          readOnly: true
        organizador_id:
          type: string
          format: uuid
          description: Dueño del evento. Sale del token de quien lo crea; no se envía.
          readOnly: true
        nombre:
          type: string
          minLength: 3
          maxLength: 120
          description: Nombre del evento tal como aparece en la cartelera.
        slug:
          type: string
          minLength: 3
          maxLength: 140
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: |-
            Parte legible de la URL pública (`<nombre>-<año>-<4 caracteres>`). La genera el servidor al crear el
            evento y no cambia nunca.
          readOnly: true
        descripcion:
          type: string
          minLength: 20
          maxLength: 2000
          description: 'Texto plano: qué va a pasar, horario de puertas, qué llevar.'
        categoria:
          $ref: '#/components/schemas/CategoriaEvento'
        lugar:
          type: string
          minLength: 2
          maxLength: 120
          description: 'Nombre del sitio: bar, coliseo, parque, reserva.'
        direccion:
          type: string
          minLength: 5
          maxLength: 160
          description: Dirección o indicación para llegar (en zona rural, vereda y kilómetro).
        municipio:
          $ref: '#/components/schemas/MunicipioCasanare'
          description: Municipio donde ocurre el evento (dominio `municipio_casanare`). Filtra la cartelera.
        fecha_inicio:
          type: string
          format: date-time
          description: Hora de inicio (ISO 8601 con desfase `-05:00`). Debe ser futura al publicar.
        fecha_fin:
          type: string
          format: date-time
          description: Hora de cierre; posterior a `fecha_inicio` (puede ser la madrugada siguiente).
        aforo_total:
          type: integer
          minimum: 1
          maximum: 100000
          description: |-
            Capacidad autorizada del lugar. La suma de `cantidad_total` de los tipos de boleta no puede
            superarla.
        edad_minima:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 21
          description: |-
            Edad mínima para entrar; `null` = todo público. Si tiene valor, la compra exige
            `comprador_documento`.
        es_gratuito:
          type: boolean
          description: 'Evento de entrada libre con boleta para controlar el aforo: todos sus tipos valen 0.'
        politica_reembolso:
          $ref: '#/components/schemas/PoliticaReembolso'
        imagen_url:
          type:
            - string
            - 'null'
          format: uri
          maxLength: 500
          pattern: ^https://
          description: Póster o portada; solo direcciones `https://`. `null` si no tiene.
        estado:
          $ref: '#/components/schemas/EstadoEvento'
          readOnly: true
        version:
          type: integer
          minimum: 1
          description: 'Versión para el bloqueo optimista: sube en cada cambio. La edición debe enviar la versión que leyó.'
          readOnly: true
        creado_en:
          type: string
          format: date-time
          description: Fecha de creación. La pone el servidor.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          description: Última modificación. La pone el servidor en cada cambio.
          readOnly: true
        organizador:
          $ref: '#/components/schemas/OrganizadorPublico'
          x-relacion: organizador
          description: |-
            Quien organiza el evento, con su parte pública (sin correo ni teléfono): la cartelera muestra
            «Organiza: …» sin otra petición. Es el mismo organizador de `organizador_id`.
        tipos_boleta:
          type: array
          x-relacion: tipo_boleta
          description: Tipos de boleta del evento, en el orden en que se crearon.
          items:
