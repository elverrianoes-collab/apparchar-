  /eventos/{evento_id}/tipos-boleta:
    post:
      operationId: crearTipoBoleta
      tags:
        - Tipos de boleta
      summary: Agregar un tipo de boleta a un evento
      description: |-
        Agrega una localidad o clase de entrada a un evento del organizador del token. Existe aparte de
        `crearEvento` porque es común abrir una localidad nueva después de publicar (una zona VIP, una
        segunda preventa). Los opcionales toman sus valores por defecto (ver `TipoBoletaNuevo`). La cabecera
        `Location` apunta a `obtenerTipoBoleta`.

        409, porque el estado actual del evento lo impide: ya tiene un tipo con ese nombre
        (`tipo_boleta_nombre_repetido`, índice `tipo_boleta_evento_id_nombre_key`), o está `cancelado` o
        `finalizado` y ya no admite tipos nuevos (`evento_no_disponible`).

        422, porque los datos enviados rompen una regla: con el tipo nuevo, la suma de cupos supera
        `aforo_total` (`aforo_excedido`); en un evento gratuito el precio debe ser 0
        (`precio_en_evento_gratuito`); `venta_termina_en` debe ser posterior a `venta_inicia_en` y no
        posterior a `fecha_fin` (`ventana_de_venta_invalida`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/evento_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoBoletaNuevo'
            examples:
              mesa_vip:
                summary: Mesa VIP para el concierto acústico
                value:
                  nombre: Mesa VIP
                  descripcion: Mesa para cuatro frente a la tarima; se vende por persona.
                  precio_cop: 70000
                  cantidad_total: 20
                  maximo_por_orden: 4
                  venta_inicia_en: '2026-10-01T10:00:00-05:00'
                  venta_termina_en: '2027-01-16T20:00:00-05:00'
              minimo:
                summary: 'Solo los obligatorios: los demás toman su valor por defecto'
                value:
                  nombre: Cortesía prensa
                  precio_cop: 0
                  cantidad_total: 10
      responses:
        '201':
          description: Tipo de boleta creado.
          headers:
            Location:
              description: Ruta del recurso creado.
              schema:
                type: string
                format: uri-reference
              example: /tipos-boleta/8d27b5f0-3e6a-4c19-a7d2-4b0e9f61c385
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoBoleta'
              examples:
                mesa_vip:
                  summary: Mesa VIP creada con cupo 20
                  value:
                    id: 8d27b5f0-3e6a-4c19-a7d2-4b0e9f61c385
                    evento_id: f3b8c2d1-6a4e-4f7b-9c20-8e5d1a7b3c46
                    nombre: Mesa VIP
                    descripcion: Mesa para cuatro frente a la tarima; se vende por persona.
                    precio_cop: 70000
                    cantidad_total: 20
                    cantidad_vendida: 0
                    maximo_por_orden: 4
                    venta_inicia_en: '2026-10-01T10:00:00-05:00'
                    venta_termina_en: '2027-01-16T20:00:00-05:00'
                    creado_en: '2026-09-30T20:22:00-05:00'
                    actualizado_en: '2026-09-30T20:22:00-05:00'
                minimo:
                  summary: Cortesía con los valores por defecto (máximo 10 por orden, venta desde ahora hasta el inicio)
                  value:
                    id: 2a4c6e81-7b3d-4f5a-9e0c-1d8b6a4f2e97
                    evento_id: f3b8c2d1-6a4e-4f7b-9c20-8e5d1a7b3c46
                    nombre: Cortesía prensa
                    descripcion: null
