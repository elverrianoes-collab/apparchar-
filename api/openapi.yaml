          readOnly: true
        nombre:
          type: string
          minLength: 2
          maxLength: 60
          description: Nombre del tipo («General», «VIP»). No se repite dentro del mismo evento.
        descripcion:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Qué incluye el tipo de boleta.
        precio_cop:
          type: integer
          minimum: 0
          maximum: 10000000
          description: Precio por boleta en pesos colombianos enteros. Debe ser 0 si el evento es gratuito.
        cantidad_total:
          type: integer
          minimum: 1
          maximum: 100000
          description: Cupo del tipo. Nunca menor que `cantidad_vendida`.
        cantidad_vendida:
          type: integer
          minimum: 0
          maximum: 100000
          description: Unidades comprometidas en órdenes pendientes o pagadas. La calcula el servidor.
          readOnly: true
        maximo_por_orden:
          type: integer
          minimum: 1
          maximum: 20
          description: Tope de boletas de este tipo por compra; frena la reventa.
        venta_inicia_en:
          type: string
          format: date-time
          description: Desde cuándo se vende este tipo.
        venta_termina_en:
          type: string
