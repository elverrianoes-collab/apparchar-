        - id
        - evento_id
        - nombre
        - descripcion
        - precio_cop
        - cantidad_total
        - cantidad_vendida
        - maximo_por_orden
        - venta_inicia_en
        - venta_termina_en
        - creado_en
        - actualizado_en
      properties:
        id:
          type: string
