  /eventos/{evento_id}/validaciones:
    post:
      operationId: registrarValidacion
      tags:
        - Validaciones
      summary: Validar un código en la puerta
      description: |-
        El celular de la puerta envía cada código leído y el servidor decide si la persona entra. Se busca
        la boleta por `codigo` (índice `boleta_codigo_key`): si es de este evento y está `valida`, la
        validación queda `aceptada` y la boleta pasa a `usada`; si no, queda `rechazada` con `motivo`
        `ya_usada`, `cancelada`, `otro_evento` o `no_existe`. El índice único parcial
        `validacion_una_aceptada_idx` garantiza un solo ingreso aunque dos celulares lean la misma boleta al
        mismo tiempo.

        **Por qué 201 también cuando se rechaza:** cada lectura, aceptada o rechazada, crea un registro de
        auditoría. Una boleta rechazada no es un error de la petición sino su resultado; en la puerta se
        leen `resultado` y `motivo` en el cuerpo. Los errores HTTP quedan para peticiones que no se pueden
        procesar. La respuesta no trae cabecera `Location`: en esta versión no hay una operación para leer
        una lectura suelta; se consulta en `listarValidacionesDelEvento`.

        **Quién valida:** en esta versión, solo el organizador dueño del evento. En la puerta, el celular
        usa la sesión del organizador y cada persona escribe su nombre en `validada_por`; con el token de
        otro organizador responde 403. Los porteros con cuenta propia quedan para una entrega posterior.

        409 `evento_no_activo` si el evento está en `borrador` o `cancelado`, o si la lectura llega fuera de
        la ventana de la puerta: desde 6 horas antes de `fecha_inicio` hasta `fecha_fin`. La ventana se
        evalúa con la hora del servidor, que es también la que queda en `validada_en`: el celular no envía
        la hora, para que nadie pueda saltarse la ventana (el escáner sin conexión queda fuera de alcance en
        esta versión).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/evento_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacionNueva'
            examples:
              lectura_camara:
                summary: Lectura con la cámara en la portería de la reserva
                value:
                  codigo_leido: 956T-X8KV-CHV3
                  puerta: Portería de la reserva
                  validada_por: Nelson Ávila Barrera
      responses:
        '201':
          description: |-
            Lectura registrada; `resultado` dice si la persona entra. Sin cabecera `Location`: la lectura se
            consulta en `listarValidacionesDelEvento`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validacion'
              examples:
                aceptada:
                  $ref: '#/components/examples/ValidacionAceptada'
                rechazada_ya_usada:
                  $ref: '#/components/examples/ValidacionRechazadaYaUsada'
                rechazada_no_existe:
                  $ref: '#/components/examples/ValidacionRechazadaNoExiste'
        '400':
          description: |-
            La petición no cumple el esquema (JSON mal formado, tipo equivocado, obligatorio faltante, valor
            fuera de rango o del dominio, parámetro inválido) o se contradice a sí misma. Se detecta sin
            consultar la base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                codigo_vacio:
                  summary: Código vacío y sin el nombre de quien valida
                  value:
                    codigo: solicitud_invalida
                    mensaje: La solicitud tiene datos inválidos.
                    detalles:
                      - campo: codigo_leido
                        problema: Es obligatorio (1 a 64 caracteres).
                      - campo: validada_por
                        problema: Es obligatorio (2 a 120 caracteres).
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El token es válido, pero el evento pertenece a otro organizador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sin_permiso:
                  summary: El evento es de otro organizador
                  value:
                    codigo: sin_permiso
                    mensaje: Este evento pertenece a otro organizador; no puedes validar boletas en su puerta.
        '404':
          description: No existe el recurso pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                evento_no_encontrado:
                  summary: El id no corresponde a ningún evento
                  value:
                    codigo: evento_no_encontrado
                    mensaje: No encontramos ese evento.
        '409':
          description: |-
            La puerta del evento no está abierta: el evento está en borrador o cancelado, o la lectura llega
            fuera de la ventana de la puerta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                evento_no_activo:
                  summary: Lectura dos días antes del taller
                  value:
                    codigo: evento_no_activo
                    mensaje: La puerta de «Taller de fotografía de aves en los esteros» se habilita desde el 11 de diciembre a las 11:00 p. m. (6 horas antes del inicio) hasta el cierre.
    get:
      operationId: listarValidacionesDelEvento
      tags:
        - Validaciones
      summary: Ver las lecturas de la puerta
      description: |-
        Lecturas del evento, las más recientes primero (índice `validacion_evento_idx`), para el conteo en
        vivo del aforo y la auditoría del ingreso. Exige el token del organizador dueño del evento, el mismo
        con el que el celular de la puerta registra las lecturas (403 si el evento es de otro organizador).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/evento_id'
        - name: resultado
          in: query
          required: false
          description: Filtra por resultado de la lectura.
          schema:
            $ref: '#/components/schemas/ResultadoValidacion'
          example: rechazada
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/por_pagina'
      responses:
        '200':
          description: Lecturas del evento.
          headers:
            X-Total-Count:
              description: Total de registros que cumplen el filtro, sin contar la paginación.
              schema:
                type: integer
                minimum: 0
              example: 3
          content:
            application/json:
              schema:
                type: array
