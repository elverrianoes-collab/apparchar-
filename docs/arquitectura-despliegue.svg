<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .titulo { font-size: 30px; font-weight: 800; fill: #0f172a; }
      .subtitulo { font-size: 17px; fill: #334155; }
      .panel { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .nota { font-size: 15px; fill: #334155; }
      .nombre { font-size: 21px; font-weight: 800; fill: #0f172a; }
      .detalle { font-size: 15px; fill: #1e293b; }
      .etiqueta { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .red { font-size: 15px; font-weight: 700; fill: #475569; }
      .paso { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .paso-detalle { font-size: 14px; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="1090" fill="#ffffff"/>

  <text x="40" y="52" class="titulo">Apparchar · arquitectura de despliegue (Entrega 4)</text>
  <text x="40" y="82" class="subtitulo">Los nombres de los servicios son los de compose.yaml y render.yaml. Solo un servicio recibe tráfico desde internet en cada despliegue.</text>

  <!-- ===================== Panel izquierdo: docker compose ===================== -->
  <rect x="40" y="110" width="900" height="760" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="146" class="panel">docker compose up  ·  local o servidor propio</text>
  <text x="64" y="170" class="nota">Un comando levanta los cuatro servicios; cada uno declara healthcheck.</text>

  <!-- Internet -->
  <rect x="300" y="190" width="360" height="62" rx="31" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="217" text-anchor="middle" class="nombre">Navegador · internet</text>
  <text x="480" y="240" text-anchor="middle" class="detalle">http://localhost:8080 · https://DOMINIO</text>

  <!-- Red borde -->
  <rect x="70" y="280" width="840" height="120" rx="12" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="88" y="304" class="red">red «borde» · puerto publicado</text>

  <!-- proxy -->
  <rect x="300" y="318" width="360" height="72" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
  <text x="318" y="346" class="nombre">proxy · Caddy 2</text>
  <text x="318" y="372" class="detalle">puertos 8080 y 8443 · compresión · HTTPS</text>
  <rect x="680" y="330" width="210" height="48" rx="8" fill="#fde68a" stroke="#b45309"/>
  <text x="785" y="352" text-anchor="middle" class="etiqueta">ÚNICO SERVICIO</text>
  <text x="785" y="370" text-anchor="middle" class="etiqueta">EXPUESTO</text>

  <!-- Red interna -->
  <rect x="70" y="425" width="840" height="370" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="895" y="780" text-anchor="end" class="red" style="fill:#3730a3">red «interna» (internal: true) · sin puertos en el host ni salida a internet</text>

  <!-- api -->
  <rect x="300" y="462" width="360" height="98" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="318" y="490" class="nombre">api · Node 22 (Dockerfile)</text>
  <text x="318" y="514" class="detalle">API REST + web en /app · puerto 3000</text>
  <text x="318" y="536" class="detalle">usuario «node» · HEALTHCHECK GET /salud</text>

  <!-- db -->
  <rect x="100" y="610" width="330" height="110" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="118" y="638" class="nombre">db · PostgreSQL 17</text>
  <text x="118" y="662" class="detalle">puerto 5432 · pg_isready</text>
  <text x="118" y="684" class="detalle">fuente de verdad de los datos</text>

  <!-- cache -->
  <rect x="530" y="610" width="350" height="110" rx="12" fill="#ffffff" stroke="#be123c" stroke-width="3"/>
  <text x="548" y="638" class="nombre">cache · Valkey 8</text>
  <text x="548" y="662" class="detalle">puerto 6379 · valkey-cli ping</text>
  <text x="548" y="684" class="detalle">cartelera (30 s) y límite de intentos</text>
  <text x="548" y="706" class="detalle">sin disco: si cae, la API sigue</text>

  <!-- volúmenes -->
  <rect x="100" y="806" width="330" height="52" rx="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="265" y="828" text-anchor="middle" class="etiqueta">volumen datos-postgres</text>
  <text x="265" y="847" text-anchor="middle" class="detalle">sobrevive a down / restart</text>
  <rect x="530" y="806" width="350" height="52" rx="26" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="705" y="828" text-anchor="middle" class="etiqueta">volumen datos-caddy</text>
  <text x="705" y="847" text-anchor="middle" class="detalle">certificados HTTPS de Let's Encrypt</text>

  <!-- flechas compose -->
  <line x1="480" y1="252" x2="480" y2="314" stroke="#0f172a" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="492" y="272" class="etiqueta">HTTP / HTTPS</text>
  <line x1="480" y1="390" x2="480" y2="458" stroke="#0f172a" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="492" y="440" class="etiqueta">reverse_proxy api:3000</text>
  <line x1="400" y1="560" x2="300" y2="606" stroke="#0f172a" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="292" y="588" text-anchor="end" class="etiqueta">DATABASE_URL → db:5432</text>
  <line x1="560" y1="560" x2="660" y2="606" stroke="#0f172a" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="652" y="594" class="etiqueta">REDIS_URL → cache:6379</text>
  <line x1="265" y1="720" x2="265" y2="804" stroke="#0f766e" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="705" y1="378" x2="705" y2="380" stroke="none"/>
  <path d="M 890 362 C 925 380, 925 800, 882 830" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 5"/>

  <!-- ===================== Panel derecho: Render ===================== -->
  <rect x="980" y="110" width="580" height="760" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1004" y="146" class="panel">Render · URL pública (render.yaml)</text>
  <text x="1004" y="170" class="nota">Mismo Dockerfile. El borde HTTPS lo pone Render.</text>

  <rect x="1100" y="190" width="340" height="62" rx="31" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="1270" y="217" text-anchor="middle" class="nombre">Navegador · internet</text>
  <text x="1270" y="240" text-anchor="middle" class="detalle">https://(servicio).onrender.com</text>

  <rect x="1060" y="300" width="420" height="80" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
  <text x="1078" y="330" class="nombre">Borde de Render</text>
  <text x="1078" y="356" class="detalle">certificado TLS válido · balanceador · X-Forwarded-For</text>

  <rect x="1060" y="440" width="420" height="98" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="1078" y="468" class="nombre">apparchar · servicio web</text>
  <text x="1078" y="492" class="detalle">imagen del Dockerfile · plan free</text>
  <text x="1078" y="514" class="detalle">healthCheckPath /salud · TRUST_PROXY=1</text>

  <rect x="1010" y="610" width="250" height="110" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="1026" y="638" class="nombre">apparchar-db</text>
  <text x="1026" y="662" class="detalle">PostgreSQL 17</text>
  <text x="1026" y="684" class="detalle">administrado, persistente</text>
  <text x="1026" y="706" class="detalle">solo red interna</text>

  <rect x="1290" y="610" width="250" height="110" rx="12" fill="#ffffff" stroke="#be123c" stroke-width="3"/>
  <text x="1306" y="638" class="nombre">apparchar-cache</text>
  <text x="1306" y="662" class="detalle">Key Value (Valkey)</text>
  <text x="1306" y="684" class="detalle">allkeys-lru</text>
  <text x="1306" y="706" class="detalle">solo red interna</text>

  <line x1="1270" y1="252" x2="1270" y2="296" stroke="#0f172a" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="1282" y="280" class="etiqueta">HTTPS</text>
  <line x1="1270" y1="380" x2="1270" y2="436" stroke="#0f172a" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="1282" y="414" class="etiqueta">HTTP interno · puerto 3000</text>
  <line x1="1200" y1="538" x2="1150" y2="606" stroke="#0f172a" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="1040" y="578" class="etiqueta">DATABASE_URL</text>
  <line x1="1340" y1="538" x2="1400" y2="606" stroke="#0f172a" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="1384" y="578" class="etiqueta">REDIS_URL</text>

  <!-- ===================== Franja inferior: CI/CD ===================== -->
  <rect x="40" y="910" width="1520" height="150" rx="16" fill="#0f172a"/>
  <text x="64" y="946" class="panel" style="fill:#ffffff">Flujo .github/workflows/ci-cd.yaml (integrar a main despliega; lo que falla se detiene)</text>

  <g>
    <rect x="64" y="966" width="300" height="74" rx="10" fill="#ffffff"/>
    <text x="82" y="994" class="paso">1 · revisar</text>
    <text x="82" y="1018" class="paso-detalle">contrato, coherencia y pruebas</text>
    <rect x="434" y="966" width="300" height="74" rx="10" fill="#ffffff"/>
    <text x="452" y="994" class="paso">2 · compose</text>
    <text x="452" y="1018" class="paso-detalle">up --wait, salud, caché y reinicio</text>
    <rect x="804" y="966" width="330" height="74" rx="10" fill="#ffffff"/>
    <text x="822" y="994" class="paso">3 · imagen</text>
    <text x="822" y="1018" class="paso-detalle">ghcr.io/…/apparchar:sha-·, latest, 0.4.0</text>
    <rect x="1204" y="966" width="332" height="74" rx="10" fill="#fbbf24"/>
    <text x="1222" y="994" class="paso">4 · desplegar (solo main)</text>
    <text x="1222" y="1018" class="paso-detalle">Deploy Hook → /salud sirve el commit</text>
  </g>
  <line x1="364" y1="973" x2="430" y2="973" stroke="#ffffff" stroke-width="3" marker-end="url(#flecha-gris)"/>
  <line x1="734" y1="973" x2="800" y2="973" stroke="#ffffff" stroke-width="3" marker-end="url(#flecha-gris)"/>
  <line x1="1134" y1="973" x2="1200" y2="973" stroke="#ffffff" stroke-width="3" marker-end="url(#flecha-gris)"/>
</svg>
